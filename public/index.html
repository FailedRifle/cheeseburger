<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="assets/styles/browser.css" />
    <script src="glass/glassJS.bundle.js"></script>
    <script src="glass/glassJS.sw.js"></script>
    <script src="glass/glassJS.config.js"></script>

    <script src="assets/js/gsap.js"></script>

    <script defer src="assets/js/browser.js"></script>
    <script type="module" defer src="assets/js/search.js"></script>
    <script type="module" defer src="assets/js/openapps.js"></script>
    <script defer type="module" src="assets/js/navFunctions.js"></script>
    <script defer src="assets/js/auto.js"></script>
    <link rel="stylesheet" href="assets/styles/assets.css" />
  <body id="body">
    <div id="nav">
      <div id="tabGroup"></div>
      <div
        id="plusdiv"
        onclick="
          newTab();
          updatewisp();
        "
      >
        <p class="plus">+</p>
      </div>
    </div>
    <div class="toolbar">
      <div class="goBack toolbarBtn" id="goBack">
        <img
          src="assets/img/icons/left-arrow.png"
          class="searchIcons navIconSolid"
        />
      </div>
      <div class="goForward toolbarBtn" id="goForward">
        <img
          src="assets/img/icons/right-arrow.png"
          class="searchIcons navIconSolid"
        />
      </div>
      <div class="reload toolbarBtn" id="reload" onclick="reloadX()">
        <img
          src="assets/img/icons/reload.png"
          class="searchIcons navIconSolid"
        />
      </div>
      <div class="search-container">
        <img src="assets/img/icons/search1.png" class="searchIcons" />
        <input id="rogoisdabest" placeholder="Search" class="search" />
      </div>
      <div class="more toolbarBtn" id="more">
        <img src="assets/img/icons/more.png" class="searchIcons navIconSolid" />

        <div id="moreMenu" class="menu">
          <div id="changeProxy" class="menuItem">
            <img
              src="assets/img/icons/server.png"
              alt=""
              class="menuIcons"
            />Change Pro<span class="filler">haha6767</span>xy
          </div>
          <div id="proxyMenu" class="submenu">
            <div class="submenuItem" id="setUV">
              U<span class="filler">haha6767</span>V
            </div>
            <div class="submenuItem" id="setSJ">
              S<span class="filler">haha6767</span>J
            </div>
            <div class="submenuItem" id="setAuto">
              Au<span class="filler">haha6767</span>to
            </div>
          </div>

          <div id="changeEngine" class="menuItem">
            <img
              src="assets/img/icons/search.png"
              alt=""
              class="menuIcons"
            />Change Search Engine
          </div>
          <div id="engineMenu" class="submenu">
            <div
              class="submenuItem"
              onclick="setSearchEngine('https://google.com/search?q=%s')"
            >
              Goog<span class="filler">haha6767</span>le
            </div>
            <div
              class="submenuItem"
              onclick="setSearchEngine('https://search.brave.com/search?q=%s')"
            >
              Brave
            </div>
            <div
              class="submenuItem"
              onclick="setSearchEngine('https://duckduckgo.com/?q=%s')"
            >
              DuckDu<span class="filler">haha6767</span>ckGo
            </div>
          </div>
        </div>
        <div id="overlay" class=""></div>
      </div>
    </div>
    <div class="bookmarks" id="bookmarks">
      <div>
      </div>
    </div>
    <div id="loader"><div id="bar"></div></div>
  </body>
  <script type="module" src="assets/js/navFunctions.js"></script>
</html>
