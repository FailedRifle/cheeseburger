<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA vs Browser Detector</title>
    
    <!-- Link your manifest so the browser recognizes it as a PWA -->
    <link rel="manifest" href="manifest.json">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .message {
            font-size: 24px;
            font-weight: bold;
            padding: 20px;
            border-radius: 8px;
            display: inline-block;
        }
        /* Default style for Browser */
        .browser-msg {
            color: #d9534f;
            background-color: #f2dede;
        }
        /* Style when running as PWA */
        .pwa-msg {
            color: #5cb85c;
            background-color: #dff0d8;
        }
    </style>
</head>
<body>

    <div id="status" class="message browser-msg">
        You are currently on the Browser!
    </div>

    <script>
        // Method 1: Check using matchMedia (Standard way for standalone mode)
        const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

        const statusDiv = document.getElementById('status');

        if (isPWA) {
            statusDiv.textContent = "You are currently on the PWA!";
            statusDiv.className = "message pwa-msg";
        } else {
            statusDiv.textContent = "You are currently on the Browser!";
            statusDiv.className = "message browser-msg";
        }

        // Optional: Register your service worker so the PWA install prompt / offline features work smoothly
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service Worker registered!', reg))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>

</body>
</html>
