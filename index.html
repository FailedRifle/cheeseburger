<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheddarOS</title>
    
    <link rel="manifest" href="loader/manifest.json">
    <link rel="icon" href="loader/favicon.png" type="image/png">
</head>
<body>

    <div id="status">Loading...</div>

    <script>
        const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

        if (isPWA) {
            // Passing width and height forces browsers to open a new separate window instead of a tab
            try {
                const newWindow = window.open('about:blank', '_blank', 'width=600,height=400,toolbar=no,menubar=no,scrollbars=yes,resizable=yes');
                if (newWindow) {
                    newWindow.document.write(`
                        <html>
                        <head><title>about:blank</title></head>
                        <body style="font-family: monospace; padding: 20px;">
                            PWA
                        </body>
                        </html>
                    `);
                    newWindow.document.close();
                } else {
                    document.body.innerHTML = "PWA (Popup blocked - please allow popups)";
                    document.title = "about:blank";
                }
            } catch (e) {
                document.body.innerHTML = "PWA";
                document.title = "about:blank";
            }
        } else {
            document.getElementById('status').textContent = "You are currently on the browser.";
            document.title = "Browser";
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('loader/service-worker.js', { scope: './' })
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>

</body>
</html>
