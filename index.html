<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheddarOS</title>
    
    <link rel="manifest" href="loader/manifest.json">
    <link rel="icon" href="loader/favicon.png" type="image/png">
</head>
<body>

    <div id="status">Loading...</div>

    <script>
        const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

        if (isPWA) {
            // Attempt to open a new blank tab and write the message into it
            try {
                const newTab = window.open('about:blank', '_blank');
                if (newTab) {
                    newTab.document.write(`
                        <html>
                        <head><title>about:blank</title></head>
                        <body style="font-family: monospace; padding: 20px;">
                            PWA
                        </body>
                        </html>
                    `);
                    newTab.document.close();
                } else {
                    // Fallback if browser blocks the automatic popup
                    document.body.innerHTML = "PWA (Enable popups to open in a new tab)";
                    document.title = "about:blank";
                }
            } catch (e) {
                document.body.innerHTML = "PWA";
                document.title = "about:blank";
            }
        } else {
            document.getElementById('status').textContent = "You are currently on the browser.";
            document.title = "Browser";
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('loader/service-worker.js', { scope: './' })
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>

</body>
</html>
