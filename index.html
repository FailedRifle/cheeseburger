<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheddarOS</title>
    <link rel="icon" href="loader/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #000000;
            color: #555555;
            font-family: 'Roboto Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 14px;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div id="status">Please install the app to continue using CheddarOS</div>
    <script>
        const installable = false;
        const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

        if (isPWA && installable) {
            fetch('core/browser.html')
                .then(response => {
                    if (!response.ok) throw new Error();
                    return response.text();
                })
                .then(htmlContent => {
                    const newWindow = window.open('about:blank#cheddar', '_blank', 'width=800,height=600,toolbar=no,menubar=no,scrollbars=yes,resizable=yes');
                    if (newWindow) {
                        newWindow.document.write(htmlContent);
                        newWindow.document.close();
                        window.close();
                    } else {
                        document.body.textContent = "Popup blocked - please allow popups for this site.";
                    }
                })
                .catch(() => {
                    document.body.textContent = "Error loading core/browser.html";
                });
        } else if (!installable) {
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
            });
        } else {
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('loader/service-worker.js', { scope: './' }).catch(() => {});
                });
            }
        }
    </script>
</body>
</html>
