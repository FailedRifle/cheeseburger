<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link href="/loader/favicon.png" rel="icon" type="image/png">
  <link id="pwa-manifest" rel="manifest" href="/loader/manifest.json">
  <meta name="theme-color" content="#000000">
  <title>CheddarOS</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    #msg {
      font-size: 14px;
      color: #888;
      text-align: center;
      max-width: 260px;
      line-height: 1.4;
      display: none;
    }
    #launch-btn {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 10px;
      cursor: pointer;
      display: none;
    }
    #launch-btn:hover {
      background: #2a2a2a;
    }
  </style>
</head>
<body>
  <div id="msg">Open CheddarOS from the installed app (PWA) to launch.</div>
  <button id="launch-btn">Launch CheddarOS</button>

<script>
  const isPWA = window.matchMedia('(display-mode: standalone)').matches || 
                window.navigator.standalone === true;

  const msgEl  = document.getElementById('msg');
  const btnEl  = document.getElementById('launch-btn');

  // ---------- Only run in PWA ----------
  if (!isPWA) {
    msgEl.style.display = 'block';
  } else {
    // We are in the installed PWA → show the launch button
    btnEl.style.display = 'block';

    // Core injection
    async function runInjection() {
      btnEl.disabled = true;
      btnEl.textContent = 'Launching…';

      // Open about:blank FIRST (while we still have user activation)
      const newWin = window.open('about:blank#cheddar', '_blank');

      if (!newWin) {
        btnEl.textContent = 'Popup blocked – allow popups';
        btnEl.disabled = false;
        return;
      }

      try {
        const targetUrl = new URL('/core/browser.html', window.location.origin).href;
        const baseHref  = new URL('/core/', window.location.origin).href;

        const response = await fetch(`${targetUrl}?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const htmlContent = await response.text();

        newWin.document.open();
        newWin.document.write(`<base href="${baseHref}">${htmlContent}`);
        newWin.document.close();

        // Try to close the launcher window (browsers often ignore this)
        try {
          window.open('', '_self');
          window.close();
        } catch (_) {}

      } catch (e) {
        console.error('Injection failed:', e);
        newWin.document.open();
        newWin.document.write(`
          <html><body style="background:#111;color:#fff;font-family:system-ui;padding:40px">
            <h2>Failed to load CheddarOS</h2>
            <p>${e.message || e}</p>
          </body></html>
        `);
        newWin.document.close();
        btnEl.textContent = 'Failed – try again';
        btnEl.disabled = false;
      }
    }

    // Button click = guaranteed user activation
    btnEl.addEventListener('click', runInjection);
  }

  // ---------- PWA install prompt (only relevant in regular browser) ----------
  if (!isPWA) {
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    // Optional: you can add a custom “Install” button here if you want
  }

  // Service worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/loader/service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
