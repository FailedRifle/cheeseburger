<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheddarOS</title>
    <link id="manifest-link" rel="manifest" href="">
    <link rel="icon" href="loader/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #000000;
            color: #555555;
            font-family: 'Roboto Mono', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 14px;
            font-weight: 300;
            gap: 15px;
        }
        #install-btn {
            background: transparent;
            border: 1px solid #555555;
            color: #888888;
            font-family: 'Roboto Mono', monospace;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            display: none;
        }
        #install-btn:hover {
            border-color: #888888;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div id="status">Please install the app to continue using CheddarOS</div>
    <button id="install-btn">Install</button>
    <script>
        const installable = true;
        const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        let deferredPrompt;

        if (installable) {
            document.getElementById('manifest-link').href = 'loader/manifest.json';
        }

        if (isPWA && installable) {
            // Load the browser on its real origin URL. Writing the page into an
            // about:blank popup gives it an opaque origin, which prevents its
            // Service Worker from registering.
            window.location.replace(new URL('core/browser.html', window.location.href).href);
        } else if (installable) {
            const btn = document.getElementById('install-btn');
            
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                btn.style.display = 'block';
            });

            btn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    await deferredPrompt.userChoice;
                    deferredPrompt = null;
                }
            });
        } else {
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
            });
        }

        if ('serviceWorker' in navigator && installable) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('loader/service-worker.js', { scope: './' }).catch(() => {});
            });
        }
    </script>
</body>
</html>
