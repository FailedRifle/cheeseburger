<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link href="/loader/favicon.png" rel="icon" type="image/png">
  <link id="pwa-manifest" rel="manifest" href="/loader/manifest.json">
  <meta name="theme-color" content="#000000">
  <title>CheddarOS</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    #launch-btn {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    #launch-btn:hover {
      background: #2a2a2a;
    }
    #status {
      font-size: 13px;
      color: #888;
      max-width: 280px;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <button id="launch-btn">Launch CheddarOS</button>
  <div id="status">Click to open in a new tab</div>

<script>
  const isInstallable = true;
  const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  let deferredPrompt = null;
  let promptAttempted = false;

  // ---------- Core injection (the part that must open about:blank) ----------
  async function runInjection() {
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('launch-btn');

    // 1. Open about:blank FIRST — while we still have user activation
    const newWin = window.open('about:blank#cheddar', '_blank');

    if (!newWin) {
      statusEl.textContent = 'Popup blocked. Please allow popups for this site and try again.';
      btn.disabled = false;
      return;
    }

    // Show loading state in the original window
    statusEl.textContent = 'Loading CheddarOS…';
    btn.disabled = true;

    try {
      const targetUrl = new URL('/core/browser.html', window.location.origin).href;
      const baseHref  = new URL('/core/', window.location.origin).href;

      const response = await fetch(`${targetUrl}?t=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const htmlContent = await response.text();

      // 2. Write into the already-opened about:blank window
      newWin.document.open();
      newWin.document.write(`<base href="${baseHref}">${htmlContent}`);
      newWin.document.close();

      // Optional: try to close / navigate away from the launcher tab
      // (browsers often ignore this, which is fine)
      try {
        window.open('', '_self');
        window.close();
      } catch (_) {}

    } catch (e) {
      console.error('Injection failed:', e);
      newWin.document.open();
      newWin.document.write(`
        <html><body style="background:#111;color:#fff;font-family:system-ui;padding:40px">
          <h2>Failed to load CheddarOS</h2>
          <p>${e.message || e}</p>
        </body></html>
      `);
      newWin.document.close();
      statusEl.textContent = 'Failed to load. Check console.';
      btn.disabled = false;
    }
  }

  // ---------- Button click (guarantees user activation) ----------
  document.getElementById('launch-btn').addEventListener('click', () => {
    runInjection();
  });

  // ---------- Auto-launch when already running as installed PWA ----------
  if (isPWA) {
    // Small delay so the page is fully ready, then auto-click
    setTimeout(() => {
      document.getElementById('launch-btn').click();
    }, 100);
  }

  // ---------- PWA install prompt logic (kept from original) ----------
  if (!isInstallable) {
    const manifest = document.getElementById('pwa-manifest');
    if (manifest) manifest.remove();
    window.addEventListener('beforeinstallprompt', (e) => e.preventDefault());
  }

  async function tryInstallPrompt() {
    if (!isInstallable || isPWA || promptAttempted || !deferredPrompt) return;
    promptAttempted = true;

    try {
      await deferredPrompt.prompt();
      await deferredPrompt.userChoice;
    } catch (_) {
    } finally {
      deferredPrompt = null;
      removePromptListeners();
    }
  }

  function addPromptListeners() {
    window.addEventListener('click', tryInstallPrompt, { once: true });
    window.addEventListener('keydown', tryInstallPrompt, { once: true });
    window.addEventListener('touchstart', tryInstallPrompt, { once: true });
  }

  function removePromptListeners() {
    window.removeEventListener('click', tryInstallPrompt);
    window.removeEventListener('keydown', tryInstallPrompt);
    window.removeEventListener('touchstart', tryInstallPrompt);
  }

  if (isInstallable && !isPWA) {
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      addPromptListeners();
    });
  }

  // Service worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/loader/service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
