<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheddarOS</title>
    
    <link rel="manifest" href="loader/manifest.json">
    <link rel="icon" href="loader/favicon.png" type="image/png">
</head>
<body>

    <div id="status">Loading...</div>

    <script>
        const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

        if (isPWA) {
            // Fetch core/browser.html and write its content into the new window
            fetch('core/browser.html')
                .then(response => {
                    if (!response.ok) throw new Error('Failed to load core/browser.html');
                    return response.text();
                })
                .then(htmlContent => {
                    const newWindow = window.open('about:blank', '_blank', 'width=800,height=600,toolbar=no,menubar=no,scrollbars=yes,resizable=yes');
                    if (newWindow) {
                        newWindow.document.write(htmlContent);
                        newWindow.document.close();
                    } else {
                        document.body.innerHTML = "Popup blocked - please allow popups for this site.";
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.body.innerHTML = "Error loading core/browser.html";
                });
        } else {
            document.getElementById('status').textContent = "You are currently on the browser.";
            document.title = "Browser";
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('loader/service-worker.js', { scope: './' })
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>

</body>
</html>
