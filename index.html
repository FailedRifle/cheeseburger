<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>‎ </title>
    <link id="manifest-link" rel="manifest" href="">
    <link id="app-window-favicon" rel="icon" href="loader/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #000000;
            color: #555555;
            font-family: 'Roboto Mono', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 14px;
            font-weight: 300;
            gap: 15px;
        }
        #install-btn {
            background: transparent;
            border: 1px solid #555555;
            color: #888888;
            font-family: 'Roboto Mono', monospace;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            display: none;
        }
        #install-btn:hover {
            border-color: #888888;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div id="status">Please install the app to continue using CheddarOS</div>
    <button id="install-btn">Install</button>

    <script>
        const installable = true;
        const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        let deferredPrompt;

        if (installable) {
            document.getElementById('manifest-link').href = 'loader/manifest.json';
        }

        function openCheddarBrowserTab() {
            try {
                if (window.parent === window || typeof window.parent.cheddarOpenBrowserTab !== 'function') return false;
                window.parent.cheddarOpenBrowserTab();
                return true;
            } catch {
                return false;
            }
        }

        if (isPWA && installable) {
            const browserUrl = new URL('core/browser.html', window.location.href).href;
            const launchMode = localStorage.getItem('cheddar-app-launch-mode') || 'window';

            if (launchMode === 'normal-tab') {
                window.__cheddarAllowClose = true;
                window.location.replace(browserUrl);
            } else if (launchMode === 'chrome-tab') {
                const newTab = window.open(browserUrl, '_blank');
                document.body.textContent = newTab
                    ? 'CheddarOS opened in a new Chrome tab. You can close this window.'
                    : 'Pop-up blocked - please allow pop-ups for this site.';
            } else if (launchMode === 'cheddar-tab' && openCheddarBrowserTab()) {
                document.body.textContent = 'CheddarOS opened in a browser tab.';
            } else if (launchMode === 'cheddar-tab') {
                window.__cheddarAllowClose = true;
                window.location.replace(browserUrl);
            } else {
                const newWindow = window.open('about:blank#cheddar', '_blank', 'width=800,height=600,toolbar=no,menubar=no,scrollbars=yes,resizable=yes');

                if (newWindow) {
                    const doc = newWindow.document;
                    const cloaks = {
                        default: ['CheddarOS', 'loader/favicon.png', 'image/png'],
                        classroom: ['Google Classroom', 'core/images/cloakicons/classroom.ico', 'image/x-icon'],
                        docs: ['Google Docs', 'core/images/cloakicons/docs.ico', 'image/x-icon'],
                        drive: ['Google Drive', 'core/images/cloakicons/drive.ico', 'image/x-icon'],
                        genesis: ['Genesis', 'core/images/cloakicons/genesis.ico', 'image/x-icon'],
                        gmail: ['Gmail', 'core/images/cloakicons/gmail.ico', 'image/x-icon'],
                        slides: ['Google Slides', 'core/images/cloakicons/slides.ico', 'image/x-icon'],
                    };
                    const preset = cloaks[localStorage.getItem('cheddar-app-cloak')] || cloaks.default;
                    const iconUrl = new URL(preset[1], window.location.href).href;
                    doc.open();
                    doc.write(`<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>${preset[0]}</title><link id="app-window-favicon" rel="icon" href="${iconUrl}" type="${preset[2]}"><style>html,body,iframe{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{display:block;border:0}</style></head><body><iframe src="${browserUrl}" title="${preset[0]}"></iframe></body></html>`);
                    doc.close();
                    window.__cheddarAllowClose = true;
                    window.close();
                } else {
                    document.body.textContent = "Pop-up blocked - please allow pop-ups for this site.";
                }
            }
        } else if (installable) {
            const btn = document.getElementById('install-btn');
            
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                btn.style.display = 'block';
            });

            btn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    await deferredPrompt.userChoice;
                    deferredPrompt = null;
                }
            });
        } else {
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
            });
        }

        if ('serviceWorker' in navigator && installable) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('loader/service-worker.js', { scope: './' }).catch(() => {});
            });
        }
        
          window.addEventListener('beforeunload', e => {
            if (window.__cheddarAllowClose) return;
            e.preventDefault();
            e.returnValue = '';
        });
    </script>
</body>
</html>
