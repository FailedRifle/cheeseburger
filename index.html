<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>about:blank</title>
    
    <link rel="manifest" href="loader/manifest.json">
    <link rel="icon" href="loader/favicon.png" type="image/png">

    <style>
        body {
            font-family: monospace;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div id="content">Loading...</div>

    <script>
        const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        const contentDiv = document.getElementById('content');

        if (isPWA) {
            // Appends #pwa to the URL to mimic an about:blank# style effect
            if (!window.location.hash) {
                window.location.hash = 'pwa';
            }
            contentDiv.textContent = "PWA";
            document.title = "about:blank";
        } else {
            contentDiv.textContent = "You are currently on the browser.";
            document.title = "Browser";
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('loader/service-worker.js', { scope: './' })
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>

</body>
</html>
