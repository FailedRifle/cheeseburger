<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #121212;
    --sidebar-bg: #0f0f0f;
    --panel-bg: #1a1a1a;
    --card-bg: #1e1e1e;
    --border: #333333;
    --border-hover: #555555;
    --text: #e0e0e0;
    --text-dim: #999999;
    --text-muted: #676767;
    --accent: #ffffff;
    --yellow: #ffd700;
    --red: #ff5252;
    --header-h: 56px;
    --sidebar-w: 220px;
    --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0c0c0c; }
  #app {
    width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--font); display: flex; flex-direction: column; overflow: hidden;
  }

  #header {
    display: flex; align-items: center;
    height: var(--header-h); min-height: var(--header-h);
    border-bottom: 2px solid var(--border);
    background: var(--sidebar-bg); flex-shrink: 0;
  }
  #logo {
    width: var(--sidebar-w); min-width: var(--sidebar-w);
    padding: 0 14px; border-right: 1px solid var(--border);
    height: 100%; display: flex; flex-direction: column; justify-content: center;
  }
  #logo h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; color: var(--accent); line-height: 1; }
  #header-fill { flex: 1; }

  #body { display: flex; flex: 1; overflow: hidden; min-height: 0; }

  #sidebar {
    width: var(--sidebar-w); min-width: var(--sidebar-w);
    background: var(--sidebar-bg); border-right: 1px solid var(--border);
    overflow-y: auto; flex-shrink: 0; padding-top: 6px;
  }
  #sidebar::-webkit-scrollbar { width: 3px; }
  #sidebar::-webkit-scrollbar-thumb { background: var(--border); }

  .sidebar-section { margin-bottom: 2px; }
  .sidebar-header { padding: 7px 14px 4px; font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; }
  .sidebar-item {
    display: flex; align-items: center; gap: 7px;
    width: 100%; background: none; border: none;
    text-align: left; padding: 5px 14px;
    font-family: var(--font); font-size: 12px; color: var(--text);
    cursor: pointer; transition: background 0.1s, color 0.1s;
  }
  .sidebar-item-icon {
    width: 16px; height: 16px; border-radius: 3px; object-fit: cover;
    flex-shrink: 0; background: var(--card-bg); border: 1px solid var(--border);
  }
  .sidebar-item-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .sidebar-item:hover { background: var(--panel-bg); }
  .sidebar-item.active { background: var(--panel-bg); color: var(--accent); font-weight: 600; border-left: 2px solid var(--accent); padding-left: 12px; }
  .sidebar-item.fav-item { color: var(--yellow); }
  .sidebar-divider { height: 1px; background: var(--border); margin: 5px 0; }

  #main { flex: 1; overflow-y: auto; background: var(--bg); }
  #main::-webkit-scrollbar { width: 5px; }
  #main::-webkit-scrollbar-thumb { background: var(--border); }

  .page { display: none; padding: 18px 24px; }
  .page.active { display: block; }

  .section-label { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 8px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .card {
    background: var(--panel-bg); border: 1px solid var(--border);
    border-radius: 4px; overflow: hidden; cursor: pointer;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: var(--border-hover); }
  .card .card-img { width: 100%; aspect-ratio: 4/3; background: var(--card-bg); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card .card-img img { width: 100%; height: 100%; object-fit: cover; }
  .card .no-img { font-size: 9px; color: var(--text-muted); }
  .card .card-label { padding: 6px 8px; font-size: 11px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .empty-note { font-size: 11px; color: var(--text-muted); margin-bottom: 20px; }

  #game-search { width: 100%; background: var(--panel-bg); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 4px; font-family: var(--font); font-size: 11px; outline: none; }
  #search-dropdown { display:none; position:absolute; top:100%; left:10px; right:10px; background: var(--sidebar-bg); border: 1px solid var(--border); border-top: none; z-index: 1000; max-height: 260px; overflow-y: auto; box-shadow: 0 6px 14px rgba(0,0,0,0.5); }

  #game-page { display: none; flex-direction: column; height: 100%; }
  #game-page.active { display: flex; }
  .game-banner { width: 100%; height: 200px; min-height: 200px; max-height: 200px; background: var(--panel-bg); display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--border); overflow: hidden; flex-shrink: 0; }
  .game-banner img { width: 100%; height: 100%; object-fit: cover; }
  .game-banner .no-banner { color: var(--text-muted); font-size: 12px; }
  .game-meta { display: flex; align-items: center; background: var(--card-bg); border-bottom: 1px solid var(--border); flex-shrink: 0; min-height: 44px; }
  .game-play-btn { background: var(--card-bg); border: none; border-right: 1px solid var(--border); color: var(--accent); font-family: var(--font); font-size: 12px; font-weight: 700; padding: 10px 20px; cursor: pointer; transition: background 0.15s; text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0; }
  .game-play-btn:hover { background: var(--panel-bg); }
  .game-fav-btn { background: none; border: none; border-right: 1px solid var(--border); padding: 10px 12px; cursor: pointer; font-size: 15px; flex-shrink: 0; transition: opacity 0.15s; color: var(--text-dim); }
  .game-fav-btn:hover { opacity: 0.7; }
  .game-meta-info { display: flex; align-items: center; gap: 9px; padding: 0 12px; overflow: hidden; min-width: 0; }
  .game-icon-sm { width: 26px; height: 26px; border-radius: 4px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border); background: var(--card-bg); }
  .game-name-bar { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .game-body { padding: 16px 20px; overflow-y: auto; }
  .game-desc-box { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 4px; padding: 14px; font-size: 12px; color: var(--text-dim); line-height: 1.6; max-width: 720px; }
  .game-offline-notice { padding: 10px 14px; background: #200; border: 1px solid var(--red); border-radius: 4px; font-size: 12px; color: var(--red); max-width: 720px; }

  .playtime-badge {
    display:inline-flex; align-items:center; gap:6px; background: var(--card-bg);
    border: 1px solid var(--border); border-radius: 4px; padding: 4px 10px;
    font-size: 11px; color: var(--text-dim); margin-bottom: 12px;
  }
</style>
</head>
<body>

<div id="app">
  <div id="header">
    <div id="logo"><h1>Game Library</h1></div>
    <div id="header-fill"></div>
  </div>

  <div id="body">
    <div id="sidebar">
      <div style="padding:7px 10px;position:relative;">
        <input type="text" id="game-search" placeholder="Search games..." autocomplete="off">
        <div id="search-dropdown"></div>
      </div>

      <div class="sidebar-section" id="fav-section" style="display:none">
        <div class="sidebar-header" style="color:var(--yellow)">- FAVORITES</div>
        <div id="fav-sidebar"></div>
      </div>
      <div class="sidebar-divider" id="fav-divider" style="display:none"></div>

      <div class="sidebar-section">
        <div class="sidebar-header">- ALL GAMES</div>
        <div id="games-sidebar"></div>
      </div>
    </div>

    <div id="main">
      <div class="page active" id="page-home">
        <div class="section-label">Popular Games</div>
        <div class="grid" id="popular-grid"></div>
        <div id="popular-empty" class="empty-note" style="display:none;">Play a few games and your most-played will show up here.</div>

        <div id="recent-wrap" style="display:none">
          <div class="section-label">Recently Played</div>
          <div class="grid" id="recent-grid"></div>
        </div>

        <div class="section-label">All Games</div>
        <div class="grid" id="all-grid"></div>
      </div>

      <div id="game-page">
        <div class="game-banner" id="game-banner"><div class="no-banner">No image</div></div>
        <div class="game-meta">
          <button class="game-play-btn" id="game-play-btn">PLAY</button>
          <button class="game-fav-btn" id="game-fav-btn">☆</button>
          <div class="game-meta-info">
            <img class="game-icon-sm" id="game-icon-sm" src="" alt="" style="display:none" onerror="this.style.display='none'">
            <div class="game-name-bar" id="game-name-bar">Game name</div>
          </div>
        </div>
        <div class="game-body" id="game-desc-area"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------------------------------------------------------------------
   Game catalog. Drop-in compatible with the old `sites` object format:
   key -> { name, enabled, src }
   Expects, for each game, files at:
     /games/<src>/icon.png
     /games/<src>/banner.png   (optional)
     /games/<src>/desc.md      (optional, plain text or markdown-ish)
     /games/<src>/index.html   (the actual game)
--------------------------------------------------------------------- */
const sites = {
  "brawl simulator 3d": { name: "Brawl Simulator 3D", enabled: true, src: "brawl-stars" },
  "moto x3m poolparty": { name: "Moto X3M PoolParty", enabled: true, src: "moto-x3m-poolparty" },
  "crossy road": { name: "Crossy Road", enabled: true, src: "crossy-roads" },
  "tiny fishing": { name: "Tiny Fishing", enabled: true, src: "tiny-fishing" },
  "raft": { name: "Raft", enabled: true, src: "raft" },
  "moto x3m": { name: "Moto X3M", enabled: true, src: "moto-x3m" },
  "nitro type": { name: "Nitro Type", enabled: true, src: "nitro-type" },
  "granny": { name: "Granny", enabled: true, src: "granny" },
  "flappy dunk": { name: "Flappy Dunk", enabled: true, src: "flappy-dunk" },
  "flappy bird": { name: "Flappy Bird", enabled: true, src: "flappy-bird" },
  "clash of vikings": { name: "Clash of Vikings", enabled: true, src: "clash-of-vikings" },
  "people playground": { name: "People Playground", enabled: true, src: "people-playground" },
  "flying gorilla": { name: "Flying Gorilla", enabled: true, src: "flying-gorilla" },
  "gta 3": { name: "Grand Theft Auto III", enabled: true, src: "gta-3" },
  "peak": { name: "PEAK", enabled: true, src: "peak" },
  "clustertruck": { name: "ClusterTruck", enabled: true, src: "clustertruck" },
  "highway racer 2": { name: "Highway Racer 2", enabled: true, src: "highway-racer-2" },
  "60 seconds": { name: "60 Seconds!", enabled: true, src: "60-seconds" },
  "baldis basic": { name: "Baldi's Basic", enabled: true, src: "baldis-basic" },
  "bowmasters": { name: "BOWMASTERS", enabled: true, src: "bowmasters" },
  "cookie clicker": { name: "Cookie Clicker", enabled: true, src: "cookie-clicker" },
  "they are coming": { name: "They are Coming", enabled: true, src: "they-are-coming" },
  "postal": { name: "Postal", enabled: true, src: "postal" },
  "orange roulette": { name: "Orange Roulette", enabled: true, src: "orange-roulette" },
  "fnae": { name: "Five Nights at Epstein's", enabled: true, src: "fnae" },
  "gta vc": { name: "Grand Theft Auto: Vice City", enabled: true, src: "gta-vc" },
  "plants vs zombies": { name: "Plants VS. Zombies", enabled: true, src: "plants-vs-zombies" },
  "raft wars 2": { name: "Raft Wars 2", enabled: true, src: "raft-wars-2" },
  "snow rider": { name: "Snow Rider 3D", enabled: true, src: "snow-rider3d" },
  "retro bowl": { name: "Retro Bowl", enabled: true, src: "retro-bowl" },
  "wrestle bros": { name: "Wrestle Bros", enabled: false, src: "wrestle-bros" },
  "potato": { name: "Throw a Potato", enabled: true, src: "throw-a-potato" },
  "drift hunters": { name: "Drift Hunters", enabled: true, src: "drift-hunters" },
  "basketball legends": { name: "Basketball Legends 2020", enabled: false, src: "basketball-legends" },
  "cheddar clicker": { name: "Cheddar Clicker", enabled: true, src: "cheddar-clicker" },
  "bloons td4": { name: "Bloons Tower Defense 4", enabled: true, src: "bloons-td4" },
  "geometry dash": { name: "Geometry Dash Lite", enabled: true, src: "geometry-dash" },
  "minecraft": { name: "Minecraft v1.8.8", enabled: true, src: "minecraft" },
  "zombies": { name: "Nazi Zombies", enabled: true, src: "nz-zombies" },
  "sm64": { name: "Super Mario 64", enabled: true, src: "sm64" },
  "buckshot": { name: "Buckshot Roulette", enabled: true, src: "buckshot-roulette" },
  "fnaf": { name: "Five Nights at Freddy's", enabled: true, src: "fnaf1" },
  "fnaf2": { name: "Five Nights at Freddy's 2", enabled: true, src: "fnaf2" },
  "fnaf3": { name: "Five Nights at Freddy's 3", enabled: false, src: "fnaf3" },
  "fnaf4": { name: "Five Nights at Freddy's 4", enabled: true, src: "fnaf4" },
  "cheese rolling": { name: "Cheese Rolling", enabled: true, src: "cheeserolling" },
  "getting over it": { name: "Getting Over It", enabled: true, src: "getting-over-it" },
  "learn to fly 3": { name: "Learn to Fly 3", enabled: true, src: "learn-to-fly3" },
  "escape road": { name: "Escape Road", enabled: true, src: "escape-road" },
  "adventure capitalist": { name: "AdVenture Capitalist!", enabled: true, src: "adventure-capitalist" },
  "backrooms": { name: "Backrooms", enabled: true, src: "backrooms" },
  "bloons td5": { name: "Bloons Tower Defense 5", enabled: true, src: "bloons-td5" },
  "idle breakout": { name: "Idle Breakout", enabled: true, src: "idle-breakout" },
};

const getGameDir = () => `/core/games`;

const FAVS_KEY = "library-favs";
const RECENT_KEY = "library-recent";
const PLAYTIME_KEY = "library-playtime";

const getFavs = () => { try { return JSON.parse(localStorage.getItem(FAVS_KEY) || "[]"); } catch { return []; } };
const setFavs = a => localStorage.setItem(FAVS_KEY, JSON.stringify(a));

const getRecent = () => { try { return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); } catch { return []; } };
function pushRecent(key) {
  let r = getRecent().filter(k => k !== key);
  r.unshift(key);
  r = r.slice(0, 8);
  localStorage.setItem(RECENT_KEY, JSON.stringify(r));
  buildRecentGrid();
}

function getPlaytimeData() { try { return JSON.parse(localStorage.getItem(PLAYTIME_KEY) || "{}"); } catch { return {}; } }
function savePlaytimeData(data) { localStorage.setItem(PLAYTIME_KEY, JSON.stringify(data)); }
function getPlaytimeMins(key) { return getPlaytimeData()[key] || 0; }
function addPlaytime(key, minutes) {
  if (minutes < 0.1) return;
  const data = getPlaytimeData();
  data[key] = parseFloat(((data[key] || 0) + minutes).toFixed(2));
  savePlaytimeData(data);
}
function formatPlaytime(totalMins) {
  if (totalMins < 1) return "0 min";
  if (totalMins < 100) return `${Math.round(totalMins)} mins`;
  return `${(totalMins / 60).toFixed(1)} hrs`;
}

function toggleFav(key) {
  let f = getFavs();
  f = f.includes(key) ? f.filter(k => k !== key) : [...f, key];
  setFavs(f);
  rebuildFavSidebar();
  renderFavBtn(key);
}
function renderFavBtn(key) {
  const btn = document.getElementById("game-fav-btn");
  const on = getFavs().includes(key);
  btn.textContent = on ? "★" : "☆";
  btn.style.color = on ? "var(--yellow)" : "var(--text-dim)";
}

/* ------------------------------ sidebar ----------------------------- */
function buildSidebar() {
  const gEl = document.getElementById("games-sidebar");
  gEl.innerHTML = "";
  Object.entries(sites).sort((a, b) => a[1].name.localeCompare(b[1].name)).forEach(([key, s]) => {
    const btn = document.createElement("button");
    btn.className = "sidebar-item";
    btn.dataset.key = key;
    btn.innerHTML = `<img class="sidebar-item-icon" src="${getGameDir()}/${s.src}/icon.png" onerror="this.style.display='none'" alt=""><span class="sidebar-item-label">${s.name}</span>`;
    btn.onclick = () => showGame(key);
    gEl.appendChild(btn);
  });
}

function rebuildFavSidebar() {
  const favs = getFavs();
  const sec = document.getElementById("fav-section");
  const div = document.getElementById("fav-divider");
  const cont = document.getElementById("fav-sidebar");
  cont.innerHTML = "";
  if (!favs.length) { sec.style.display = "none"; div.style.display = "none"; return; }
  sec.style.display = ""; div.style.display = "";
  favs.forEach(key => {
    const s = sites[key]; if (!s) return;
    const btn = document.createElement("button");
    btn.className = "sidebar-item fav-item";
    btn.dataset.key = key;
    btn.innerHTML = `<span style="flex-shrink:0;">★</span><img class="sidebar-item-icon" src="${getGameDir()}/${s.src}/icon.png" onerror="this.style.display='none'" alt=""><span class="sidebar-item-label">${s.name}</span>`;
    btn.onclick = () => showGame(key);
    cont.appendChild(btn);
  });
}

/* ------------------------------- grids ------------------------------ */
function cardHtml(key, s) {
  return `<div class="card-img"><img src="${getGameDir()}/${s.src}/icon.png" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="no-img" style="display:none;width:100%;height:100%;align-items:center;justify-content:center;">No img</div></div><div class="card-label">${s.name}</div>`;
}

function buildAllGrid() {
  const grid = document.getElementById("all-grid");
  grid.innerHTML = "";
  Object.entries(sites).filter(([, s]) => s.enabled).sort((a, b) => a[1].name.localeCompare(b[1].name)).forEach(([key, s]) => {
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = cardHtml(key, s);
    c.onclick = () => showGame(key);
    grid.appendChild(c);
  });
}

function buildPopularGrid() {
  const grid = document.getElementById("popular-grid");
  const empty = document.getElementById("popular-empty");
  grid.innerHTML = "";
  const playtime = getPlaytimeData();
  const ranked = Object.keys(playtime)
    .filter(k => sites[k]?.enabled)
    .sort((a, b) => playtime[b] - playtime[a])
    .slice(0, 8);
  if (!ranked.length) { empty.style.display = ""; return; }
  empty.style.display = "none";
  ranked.forEach(key => {
    const s = sites[key];
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = cardHtml(key, s);
    c.onclick = () => showGame(key);
    grid.appendChild(c);
  });
}

function buildRecentGrid() {
  const recent = getRecent().filter(k => sites[k]?.enabled);
  const wrap = document.getElementById("recent-wrap");
  const grid = document.getElementById("recent-grid");
  if (!recent.length) { wrap.style.display = "none"; return; }
  wrap.style.display = "";
  grid.innerHTML = "";
  recent.forEach(key => {
    const s = sites[key];
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = cardHtml(key, s);
    c.onclick = () => showGame(key);
    grid.appendChild(c);
  });
}

/* --------------------------- search dropdown ------------------------- */
const searchInput = document.getElementById("game-search"), searchDropdown = document.getElementById("search-dropdown");
searchInput.addEventListener("input", () => renderDropdown(searchInput.value.toLowerCase().trim()));
function renderDropdown(q) {
  searchDropdown.innerHTML = "";
  if (!q) { searchDropdown.style.display = "none"; return; }
  const results = Object.entries(sites).filter(([key, s]) => s.enabled && (key.includes(q) || s.name.toLowerCase().includes(q)));
  if (!results.length) {
    searchDropdown.style.display = "block";
    searchDropdown.innerHTML = `<div style="padding:8px 10px;color:var(--red);font-size:11px;text-align:center">No results for "${q}"</div>`;
    return;
  }
  searchDropdown.style.display = "block";
  results.forEach(([key, s]) => {
    const it = document.createElement("div");
    it.className = "sidebar-item";
    it.style.paddingLeft = "18px";
    it.style.fontSize = "11px";
    it.textContent = s.name;
    it.onclick = () => { showGame(key); closeSearch(); };
    searchDropdown.appendChild(it);
  });
}
function closeSearch() { searchInput.value = ""; searchDropdown.style.display = "none"; }
document.addEventListener("click", e => { if (!e.target.closest("#sidebar")) closeSearch(); });

/* ------------------------------ pages -------------------------------- */
function showHome() {
  document.getElementById("page-home").classList.add("active");
  document.getElementById("game-page").classList.remove("active");
  document.querySelectorAll(".sidebar-item").forEach(b => b.classList.remove("active"));
}

function renderPlaytime(key) {
  const old = document.getElementById("playtime-badge");
  if (old) old.remove();
  const mins = getPlaytimeMins(key);
  const badge = document.createElement("div");
  badge.id = "playtime-badge";
  badge.className = "playtime-badge";
  badge.innerHTML = `<span style="color:var(--accent);">⏱</span><span><strong style="color:var(--text);">${formatPlaytime(mins)}</strong><span style="color:var(--text-muted);"> on record</span></span>`;
  const area = document.getElementById("game-desc-area");
  if (area) area.prepend(badge);
}

async function showGame(key) {
  const s = sites[key];
  if (!s) return;

  document.getElementById("page-home").classList.remove("active");
  document.getElementById("game-page").classList.add("active");
  document.querySelectorAll(".sidebar-item").forEach(b => b.classList.toggle("active", b.dataset.key === key));

  const bannerEl = document.getElementById("game-banner");
  bannerEl.innerHTML = `<img src="${getGameDir()}/${s.src}/banner.png" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" alt=""><div class="no-banner" style="display:none">No image</div>`;

  const ico = document.getElementById("game-icon-sm");
  ico.src = `${getGameDir()}/${s.src}/icon.png`; ico.style.display = "";
  document.getElementById("game-name-bar").textContent = s.name;

  renderFavBtn(key);
  document.getElementById("game-fav-btn").onclick = () => toggleFav(key);

  const descArea = document.getElementById("game-desc-area");
  const playBtn = document.getElementById("game-play-btn");

  if (!s.enabled) {
    descArea.innerHTML = `<div class="game-offline-notice">'${s.name}' is not currently available.</div>`;
    playBtn.disabled = true; playBtn.style.opacity = "0.4";
  } else {
    descArea.innerHTML = `<div class="game-desc-box">Loading description...</div>`;
    renderPlaytime(key);
    try {
      const r = await fetch(`${getGameDir()}/${s.src}/desc.md`);
      const text = r.ok ? await r.text() : (s.desc || "No description available.");
      descArea.querySelector(".game-desc-box").textContent = text;
    } catch {
      descArea.querySelector(".game-desc-box").textContent = s.desc || "No description available.";
    }
    playBtn.disabled = false; playBtn.style.opacity = "1";
  }
  playBtn.onclick = s.enabled ? () => launchGame(key) : null;
}

function launchGame(key) {
  const s = sites[key];
  const url = `${getGameDir()}/${s.src}/index.html`;
  pushRecent(key);

  const win = window.open(url, "_blank");
  const startTime = Date.now();

  const liveUpdateInterval = setInterval(() => {
    const elapsedMins = (Date.now() - startTime) / 60000;
    const badge = document.getElementById("playtime-badge");
    if (!badge) return;
    const total = getPlaytimeMins(key) + elapsedMins;
    const strong = badge.querySelector("strong");
    if (strong) strong.textContent = formatPlaytime(total);
  }, 30000);

  const pollInterval = setInterval(() => {
    if (!win || win.closed) {
      clearInterval(pollInterval);
      clearInterval(liveUpdateInterval);
      const elapsedMins = (Date.now() - startTime) / 60000;
      addPlaytime(key, elapsedMins);
      buildPopularGrid();
      const nameBar = document.getElementById("game-name-bar");
      if (nameBar && nameBar.textContent === s.name) renderPlaytime(key);
    }
  }, 2000);
}

(function init() {
  buildSidebar();
  rebuildFavSidebar();
  buildPopularGrid();
  buildRecentGrid();
  buildAllGrid();
})();
</script>
</body>
</html>
