<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
    }

    .browser {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      background: #1a1a1a;
    }

    /* Tabs */
    .tab-strip {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      background: #0e0e0e;
      padding: 8px 8px 0;
      overflow-x: auto;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      font-size: 13px;
      color: #b0b0b0;
      max-width: 180px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .tab.active { background: #1a1a1a; color: #fff; }
    .tab .favicon { width: 10px; height: 10px; border-radius: 2px; background: #555; flex-shrink: 0; }
    .tab .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab .close { color: #666; font-size: 14px; line-height: 1; padding: 2px; border-radius: 3px; }
    .tab .close:hover { color: #ccc; background: #333; }
    .tab-new { padding: 8px 10px; color: #666; font-size: 16px; line-height: 1; cursor: pointer; flex-shrink: 0; }
    .tab-new:hover { color: #ccc; }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      position: relative;
    }
    .nav-btn {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #262626;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      color: #999;
      font-size: 14px;
      flex-shrink: 0;
      user-select: none;
    }
    .nav-btn:hover { background: #2e2e2e; color: #ccc; }
    .nav-btn.disabled { opacity: 0.4; }
    .address-bar {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background: #262626;
      border: 1px solid #3a3a3a;
      border-radius: 20px;
      color: #ccc;
    }
    .address-bar .lock { color: #6b8; font-size: 12px; }
    .address-bar input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #eee;
      font-size: 13px;
      font-family: inherit;
    }
    .toolbar-icon {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 14px;
      flex-shrink: 0;
      user-select: none;
      border-radius: 6px;
    }
    .toolbar-icon:hover { color: #ccc; background: #232323; }

    .bookmarks-bar {
      display: flex;
      gap: 18px;
      padding: 6px 16px;
      background: #171717;
      border-bottom: 1px solid #2a2a2a;
      font-size: 12px;
      color: #888;
    }

    /* Viewport */
    .viewport {
      flex: 1;
      background: #0f0f0f;
      overflow-y: auto;
      position: relative;
    }
    .pane { display: none; height: 100%; width: 100%; }
    .pane.active { display: flex; }
    .pane iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #0f0f0f;
    }

    .view { display: none; height: 100%; }
    .view.active { display: flex; }

    /* Home view */
    #view-home { align-items: center; justify-content: center; }
    .homepage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 40px 20px;
      width: 100%;
    }
    .logo { font-size: 56px; font-weight: 700; letter-spacing: -1px; color: #f0f0f0; }
    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 560px;
      max-width: 80vw;
      padding: 12px 20px;
      background: #262626;
      border: 1px solid #3a3a3a;
      border-radius: 24px;
      color: #888;
      font-size: 15px;
    }
    .search-box .search-icon { color: #666; font-size: 14px; }

    .apps-section {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .apps-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #666; }
    .apps-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 26px; }
    .app { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; width: 64px; }
    .app .app-icon {
      width: 52px; height: 52px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; background: #1e1e1e;
      transition: transform 0.12s ease, background 0.12s ease;
    }
    .app:hover .app-icon { background: #262626; transform: scale(1.06); }
    .app .app-label { font-size: 11px; color: #999; text-align: center; }

    /* Generic page */
    #view-settings { align-items: flex-start; justify-content: flex-start; }
    .page { width: 100%; padding: 40px 60px; }
    .page h2 { font-size: 20px; color: #fff; margin: 0 0 24px; font-weight: 600; }
    .empty-note { color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <div class="browser">
    <div class="tab-strip" id="tab-strip"></div>

    <div class="toolbar">
      <div class="nav-btn" id="back-btn">‹</div>
      <div class="nav-btn" id="fwd-btn">›</div>
      <div class="nav-btn" id="reload-btn">↻</div>
      <div class="nav-btn" id="home-btn">⌂</div>
      <div class="address-bar">
        <span class="lock">🔒</span>
        <input type="text" id="address-input" value="cheddar://home" spellcheck="false">
      </div>
      <div class="toolbar-icon">☆</div>
      <div class="toolbar-icon" id="settings-btn">⚙️</div>
    </div>

    <div class="bookmarks-bar">
      <span>CHEDDAR</span>
      <span>ON</span>
      <span>TOP</span>
    </div>

    <div class="viewport" id="viewport"></div>
  </div>

  <!-- Template markup for a "browser" pane (cheddar:// pages) -->
  <template id="browser-pane-template">
    <div class="view active" id="view-home">
      <div class="homepage">
        <div class="logo">CheddarOS</div>
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <span>Search on CheddarOS</span>
        </div>
        <div class="apps-section">
          <div class="apps-label">Apps</div>
          <div class="apps-row">
            <div class="app" data-app="games"><div class="app-icon">🎮</div><div class="app-label">cheddargames</div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="view" id="view-settings">
      <div class="page">
        <h2>Settings</h2>
        <div class="empty-note">Nothing here yet.</div>
      </div>
    </div>

    <div class="view" id="view-notfound">
      <div class="page">
        <h2>This page can't be reached</h2>
        <div class="empty-note" data-notfound-detail></div>
      </div>
    </div>
  </template>

  <script>
    // ---- Tab model ----
    // A tab is either kind: "browser" (renders cheddar:// pages, has its own nav history)
    // or kind: "app" (renders an iframe pointing at a page in this repo, e.g. games.html)
    let nextTabId = 1;
    let tabs = [];
    let activeTabId = null;

    function makeBrowserTab() {
      const id = nextTabId++;
      return {
        id,
        kind: "browser",
        title: "New Tab",
        history: ["cheddar://home"],
        historyIndex: 0,
      };
    }

    function makeAppTab(title, src, addr) {
      const id = nextTabId++;
      return { id, kind: "app", title, src, addr };
    }

    function currentTab() {
      return tabs.find(t => t.id === activeTabId);
    }

    // ---- Rendering ----
    const tabStrip = document.querySelector("#tab-strip");
    const viewport = document.querySelector("#viewport");
    const addressInput = document.querySelector("#address-input");
    const paneEls = {}; // tabId -> pane DOM element

    function renderTabStrip() {
      tabStrip.innerHTML = "";
      tabs.forEach(tab => {
        const el = document.createElement("div");
        el.className = "tab" + (tab.id === activeTabId ? " active" : "");
        el.innerHTML = `
          <span class="favicon"></span>
          <span class="title">${tab.title}</span>
          <span class="close">×</span>
        `;
        el.addEventListener("click", (e) => {
          if (e.target.classList.contains("close")) return;
          switchToTab(tab.id);
        });
        el.querySelector(".close").addEventListener("click", (e) => {
          e.stopPropagation();
          closeTab(tab.id);
        });
        tabStrip.appendChild(el);
      });
      const newBtn = document.createElement("div");
      newBtn.className = "tab-new";
      newBtn.textContent = "+";
      newBtn.addEventListener("click", () => {
        const tab = makeBrowserTab();
        tabs.push(tab);
        buildPane(tab);
        switchToTab(tab.id);
      });
      tabStrip.appendChild(newBtn);
    }

    function buildPane(tab) {
      const pane = document.createElement("div");
      pane.className = "pane";
      pane.id = "pane-" + tab.id;

      if (tab.kind === "browser") {
        const tpl = document.querySelector("#browser-pane-template");
        pane.appendChild(tpl.content.cloneNode(true));
        wireBrowserPane(tab, pane);
      } else if (tab.kind === "app") {
        const iframe = document.createElement("iframe");
        iframe.src = tab.src;
        pane.appendChild(iframe);
      }

      viewport.appendChild(pane);
      paneEls[tab.id] = pane;
    }

    function wireBrowserPane(tab, pane) {
      pane.querySelector('[data-app="games"]').addEventListener("click", () => openGamesTab());

      pane.querySelector("#view-settings") // no-op ref just to ensure template ids resolved via pane
    }

    function switchToTab(id) {
      activeTabId = id;
      Object.values(paneEls).forEach(p => p.classList.remove("active"));
      paneEls[id].classList.add("active");
      renderTabStrip();
      syncToolbarForActiveTab();
    }

    function closeTab(id) {
      const idx = tabs.findIndex(t => t.id === id);
      if (idx === -1) return;
      const pane = paneEls[id];
      if (pane) pane.remove();
      delete paneEls[id];
      tabs.splice(idx, 1);

      if (tabs.length === 0) {
        const tab = makeBrowserTab();
        tabs.push(tab);
        buildPane(tab);
        switchToTab(tab.id);
        return;
      }

      if (activeTabId === id) {
        const next = tabs[idx] || tabs[idx - 1] || tabs[0];
        switchToTab(next.id);
      } else {
        renderTabStrip();
      }
    }

    function openGamesTab() {
      const tab = makeAppTab("CheddarGames", "games.html", "cheddar://games");
      tabs.push(tab);
      buildPane(tab);
      switchToTab(tab.id);
    }

    // ---- Browser-tab internal navigation (cheddar:// pages) ----
    function navigateBrowserTab(tab, url, addToHistory = true) {
      url = url.trim();
      const pane = paneEls[tab.id];
      pane.querySelectorAll(".view").forEach(v => v.classList.remove("active"));

      if (url === "cheddar://home") {
        pane.querySelector("#view-home").classList.add("active");
        tab.title = "New Tab";
      } else if (url === "cheddar://settings") {
        pane.querySelector("#view-settings").classList.add("active");
        tab.title = "Settings";
      } else {
        pane.querySelector("[data-notfound-detail]").textContent = `CheddarOS couldn't find "${url}".`;
        pane.querySelector("#view-notfound").classList.add("active");
        tab.title = "Not found";
      }

      if (addToHistory) {
        tab.history = tab.history.slice(0, tab.historyIndex + 1);
        tab.history.push(url);
        tab.historyIndex = tab.history.length - 1;
      }

      if (tab.id === activeTabId) {
        addressInput.value = url;
        renderTabStrip();
        updateNavButtons();
      }
    }

    function syncToolbarForActiveTab() {
      const tab = currentTab();
      if (!tab) return;
      if (tab.kind === "browser") {
        addressInput.value = tab.history[tab.historyIndex];
      } else {
        addressInput.value = tab.addr;
      }
      updateNavButtons();
    }

    function updateNavButtons() {
      const tab = currentTab();
      const backBtn = document.querySelector("#back-btn");
      const fwdBtn = document.querySelector("#fwd-btn");
      if (!tab || tab.kind !== "browser") {
        backBtn.classList.add("disabled");
        fwdBtn.classList.add("disabled");
        return;
      }
      backBtn.classList.toggle("disabled", tab.historyIndex <= 0);
      fwdBtn.classList.toggle("disabled", tab.historyIndex >= tab.history.length - 1);
    }

    // ---- Toolbar controls ----
    document.querySelector("#back-btn").addEventListener("click", () => {
      const tab = currentTab();
      if (!tab || tab.kind !== "browser") return;
      if (tab.historyIndex > 0) { tab.historyIndex--; navigateBrowserTab(tab, tab.history[tab.historyIndex], false); }
    });
    document.querySelector("#fwd-btn").addEventListener("click", () => {
      const tab = currentTab();
      if (!tab || tab.kind !== "browser") return;
      if (tab.historyIndex < tab.history.length - 1) { tab.historyIndex++; navigateBrowserTab(tab, tab.history[tab.historyIndex], false); }
    });
    document.querySelector("#reload-btn").addEventListener("click", () => {
      const tab = currentTab();
      if (!tab) return;
      if (tab.kind === "browser") {
        navigateBrowserTab(tab, tab.history[tab.historyIndex], false);
      } else {
        const iframe = paneEls[tab.id].querySelector("iframe");
        iframe.src = iframe.src;
      }
    });
    document.querySelector("#home-btn").addEventListener("click", () => {
      const tab = currentTab();
      if (tab && tab.kind === "browser") navigateBrowserTab(tab, "cheddar://home");
    });
    document.querySelector("#settings-btn").addEventListener("click", () => {
      const tab = currentTab();
      if (tab && tab.kind === "browser") navigateBrowserTab(tab, "cheddar://settings");
    });

    addressInput.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const tab = currentTab();
      if (tab && tab.kind === "browser") navigateBrowserTab(tab, addressInput.value);
    });

    // ---- Init ----
    const initialTab = makeBrowserTab();
    tabs.push(initialTab);
    buildPane(initialTab);
    activeTabId = initialTab.id;
    paneEls[initialTab.id].classList.add("active");
    renderTabStrip();
    syncToolbarForActiveTab();
  </script>
</body>
</html>
