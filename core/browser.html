<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg-app: #131415;
      --bg-surface: #191a1c;
      --bg-elevated: #222325;
      --bg-elevated-2: #2b2c2f;
      --border: #2d2e31;
      --border-soft: #1e1f21;
      --text: #e8eaed;
      --text-dim: #9aa0a6;
      --text-faint: #6b6e73;
      --accent: #eab23d;
      --accent-strong: #f5c563;
    }
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background-color: var(--bg-app);
      color: var(--text);
    }

    .browser {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      background: var(--bg-app);
    }

    .tab-strip {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      background: var(--bg-app);
      padding: 8px 8px 0;
      overflow-x: auto;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      background: var(--bg-app);
      border-radius: 8px 8px 0 0;
      font-size: 13px;
      color: var(--text-dim);
      max-width: 200px;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: background 0.1s ease;
    }
    .tab:hover { background: var(--bg-surface); }
    .tab.active { background: var(--bg-surface); color: var(--text); }
    .tab.active::after {
      content: "";
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 2px;
      border-radius: 8px 8px 0 0;
      background: var(--accent);
    }
    .tab .favicon { width: 16px; height: 16px; border-radius: 3px; object-fit: contain; flex-shrink: 0; }
    .tab .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab .close {
      display: flex; align-items: center; justify-content: center;
      width: 18px; height: 18px;
      color: var(--text-faint); font-size: 14px; line-height: 1;
      border-radius: 4px; flex-shrink: 0;
    }
    .tab .close:hover { color: var(--text); background: var(--bg-elevated-2); }
    .tab-new {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px;
      color: var(--text-faint); flex-shrink: 0; cursor: pointer;
      border-radius: 6px;
    }
    .tab-new:hover { color: var(--text); background: var(--bg-surface); }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-soft);
      position: relative;
    }
    .nav-btn {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border-radius: 50%;
      color: var(--text-dim);
      flex-shrink: 0;
      user-select: none;
    }
    .nav-btn:hover { background: var(--bg-elevated-2); color: var(--text); }
    .nav-btn.disabled { opacity: 0.35; pointer-events: none; }
    .nav-btn svg { width: 17px; height: 17px; }
    .address-bar {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      margin: 0 4px;
      background: var(--bg-elevated);
      border: 1px solid transparent;
      border-radius: 20px;
      color: var(--text-dim);
      transition: border-color 0.1s ease;
    }
    .address-bar:focus-within { border-color: var(--accent); }
    .address-bar .lock { display: flex; color: #7fbf7f; flex-shrink: 0; }
    .address-bar .lock svg { width: 13px; height: 13px; }
    .address-bar input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
    }
    .toolbar-icon {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      flex-shrink: 0;
      user-select: none;
      border-radius: 50%;
    }
    .toolbar-icon svg { width: 16px; height: 16px; }
    .toolbar-icon:hover { color: var(--text); background: var(--bg-elevated-2); }

    .bookmarks-bar {
      display: flex;
      gap: 4px;
      padding: 4px 10px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-soft);
      font-size: 12px;
      color: var(--text-dim);
    }
    .bookmark {
      padding: 5px 10px;
      border-radius: 6px;
      cursor: default;
    }
    .bookmark.is-link { cursor: pointer; }
    .bookmark.is-link:hover { background: var(--bg-elevated-2); color: var(--text); }

    .viewport {
      flex: 1;
      background: var(--bg-app);
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
    }
    .pane { display: none; height: 100%; width: 100%; align-items: stretch; }
    .pane.active { display: flex; }
    .pane iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: var(--bg-app);
    }

    .view { display: none; height: 100%; width: 100%; }
    .view.active { display: flex; flex: 1; }

    #view-home { align-items: center; justify-content: center; position: relative; }
    .announcement-banner {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #7a1245;
      border-bottom: 3px solid #e0308c;
      color: #fff;
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.1px;
      text-align: center;
      padding: 10px 16px;
      flex-shrink: 0;
    }
    .announcement-banner svg { width: 15px; height: 15px; flex-shrink: 0; }
    .homepage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 20px;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      box-sizing: border-box;
    }
    .logo-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .logo { font-size: 44px; font-weight: 600; letter-spacing: -0.5px; color: var(--text); line-height: 1; }
    .logo span { color: var(--accent); }
    .version-tag { font-size: 11px; color: var(--text-faint); }
    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 560px;
      max-width: 80vw;
      padding: 12px 20px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 24px;
      color: var(--text-dim);
      font-size: 14px;
      transition: border-color 0.1s ease, box-shadow 0.1s ease;
    }
    .search-box:hover { border-color: #4d4e52; box-shadow: 0 1px 6px rgba(0,0,0,0.3); }
    .search-box:focus-within { border-color: var(--accent); box-shadow: 0 1px 6px rgba(0,0,0,0.3); }
    .search-box .search-icon { display: flex; color: var(--text-faint); flex-shrink: 0; }
    .search-box .search-icon svg { width: 16px; height: 16px; }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }
    .search-box input::placeholder { color: var(--text-dim); }

    .apps-section {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .apps-label { font-size: 12px; color: var(--text-faint); }
    .apps-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 26px; }
    .app { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; width: 64px; }
    .app .app-icon {
      width: 52px; height: 52px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; background: var(--bg-elevated);
      border: 1px solid var(--border);
      transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
    }
    .app:hover .app-icon { background: var(--bg-elevated-2); border-color: var(--accent); transform: scale(1.05); }
    .app .app-label { font-size: 11px; color: var(--text-dim); text-align: center; }

    .site-footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      font-size: 11px;
      color: var(--text-faint);
      text-align: center;
    }

    #view-settings { align-items: flex-start; justify-content: flex-start; }
    .page { width: 100%; padding: 28px 48px; }
    .page h2 { font-size: 19px; color: var(--text); margin: 0 0 22px; font-weight: 600; }
    .empty-note { color: var(--text-faint); font-size: 14px; }
    .settings-list { width: min(680px, 100%); display: flex; flex-direction: column; gap: 12px; }
    .settings-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-faint);
      margin: 4px 0 -4px;
    }
    .settings-group { border: 1px solid var(--border); border-radius: 10px; background: var(--bg-surface); overflow: hidden; }
    .setting-card { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 16px 18px; border-bottom: 1px solid var(--border-soft); }
    .settings-group .setting-card:last-child { border-bottom: none; }
    .setting-copy { display: flex; flex-direction: column; gap: 5px; }
    .setting-title { color: var(--text); font-size: 14px; font-weight: 600; }
    .setting-description, .setting-status { color: var(--text-faint); font-size: 12px; line-height: 1.4; }
    .setting-card select { min-width: 210px; padding: 9px 32px 9px 11px; color: var(--text); background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 7px; font: inherit; }
    .setting-status { min-height: 17px; margin: 4px 0 0; padding: 0 18px; }
    @media (max-width: 620px) { .page { padding: 24px 18px; } .setting-card { align-items: stretch; flex-direction: column; gap: 12px; } .setting-card select { width: 100%; } }

    #view-changelog { align-items: flex-start; justify-content: flex-start; }
    .changelog-page { max-width: 720px; }
    .changelog-list { display: flex; flex-direction: column; gap: 16px; }
    .changelog-entry {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 16px 20px;
    }
    .changelog-entry-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .changelog-ver { font-size: 14px; font-weight: 600; color: var(--text); }
    .changelog-date { font-size: 12px; color: var(--text-faint); white-space: nowrap; }
    .changelog-items { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
    .changelog-items li { font-size: 13px; color: var(--text-dim); line-height: 1.45; }
  </style>
</head>
<body>
  <div class="browser">
    <div class="announcement-banner" id="global-announcement" style="display:none;"></div>
    <div class="tab-strip" id="tab-strip"></div>

    <div class="toolbar">
      <div class="nav-btn" id="back-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></div>
      <div class="nav-btn" id="fwd-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></div>
      <div class="nav-btn" id="reload-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><polyline points="21 3 21 9 15 9"></polyline></svg></div>
      <div class="nav-btn" id="home-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10h14V10"></path></svg></div>
      <div class="address-bar">
        <span class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg></span>
        <input type="text" id="address-input" value="cheddar://home" spellcheck="false">
      </div>
      <div class="toolbar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.1 8.6 22 9.3 17 14.1 18.2 21 12 17.6 5.8 21 7 14.1 2 9.3 8.9 8.6 12 2"></polygon></svg></div>
      <div class="toolbar-icon" id="settings-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 0 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 0 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z"></path></svg></div>
    </div>

    <div class="bookmarks-bar">
      <span class="bookmark">Cheddar</span>
      <span class="bookmark">On top</span>
      <span class="bookmark is-link" id="bookmark-changelog">Change logs</span>
    </div>

    <div class="viewport" id="viewport"></div>
  </div>

  <template id="browser-pane-template">
    <div class="view active" id="view-home">
      <div class="homepage">
        <div class="logo-group">
          <div class="logo">Cheddar<span>OS</span></div>
          <div class="version-tag" data-version></div>
        </div>
        <div class="search-box">
          <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
          <input type="text" data-home-search placeholder="Search on CheddarOS" spellcheck="false">
        </div>
        <div class="apps-section">
          <div class="apps-label">Apps</div>
          <div class="apps-row">
            <div class="app" data-app="games"><div class="app-icon">🎮</div><div class="app-label">cheddargames</div></div>
          </div>
        </div>
      </div>
      <div class="site-footer" data-footer></div>
    </div>

    <div class="view" id="view-settings">
      <div class="page">
        <h2>Settings</h2>
        <div class="settings-list">
          <h3 class="settings-section-title">Proxy</h3>
          <div class="settings-group">
            <label class="setting-card">
              <span class="setting-copy"><span class="setting-title">Transport</span><span class="setting-description">Choose how the proxy connects to websites.</span></span>
              <select data-setting="transport" aria-label="Transport">
                <option value="bare">Bare Server (Default)</option>
                <option value="epoxy">Epoxy</option>
                <option value="libcurl">Libcurl</option>
              </select>
            </label>
            <label class="setting-card">
              <span class="setting-copy"><span class="setting-title">Backend</span><span class="setting-description">Choose the browser proxy engine.</span></span>
              <select data-setting="backend" aria-label="Backend">
                <option value="uv">Ultraviolet (Default)</option>
                <option value="scramjet">Scramjet (Janky)</option>
              </select>
            </label>
            <label class="setting-card">
              <span class="setting-copy"><span class="setting-title">Search Engine</span><span class="setting-description">Choose where text searches are sent. DuckDuckGo uses Epoxy when Bare Server is selected.</span></span>
              <select data-setting="search-engine" aria-label="Search Engine">
                <option value="https://duckduckgo.com/?q=%s">DuckDuckGo (Default)</option>
                <option value="https://www.google.com/search?q=%s">Google</option>
                <option value="https://search.brave.com/search?q=%s">Brave</option>
                <option value="https://www.bing.com/search?q=%s">Bing</option>
              </select>
            </label>
          </div>
          <p class="setting-status" data-settings-status aria-live="polite"></p>
        </div>
      </div>
    </div>

    <div class="view" id="view-notfound">
      <div class="page">
        <h2>This page can't be reached</h2>
        <div class="empty-note" data-notfound-detail></div>
      </div>
    </div>

    <div class="view" id="view-changelog">
      <div class="page changelog-page">
        <h2>Change Logs</h2>
        <div class="changelog-list" data-changelog-list></div>
      </div>
    </div>
  </template>

  <script>
    
    const ANNOUNCEMENT_TEXT = "CheddarOS is currently in Alpha — expect bugs.";
    const OS_VERSION = "v1.0.0";

    function stripJsonComments(text) {
      return text
        .replace(/\/\*[\s\S]*?\*\//g, "")
        .replace(/(^|[^:])\/\/.*$/gm, "$1");
    }

    let changelogDataPromise = null;
    function loadChangelogData() {
      if (!changelogDataPromise) {
        changelogDataPromise = fetch("/core/json/changelogs.json")
          .then(res => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.text();
          })
          .then(text => JSON.parse(stripJsonComments(text)))
          .catch(error => {
            console.error("Could not load changelogs.json:", error);
            changelogDataPromise = null;
            return null;
          });
      }
      return changelogDataPromise;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function renderChangelog(pane) {
      const list = pane.querySelector("[data-changelog-list]");
      list.innerHTML = `<div class="empty-note">Loading change log…</div>`;
      loadChangelogData().then(data => {
        if (!list.isConnected) return;
        if (!data) {
          list.innerHTML = `<div class="empty-note">Couldn't load the change log.</div>`;
          return;
        }
        if (data.length === 0) {
          list.innerHTML = `<div class="empty-note">No changes logged yet.</div>`;
          return;
        }
        list.innerHTML = data.map(entry => `
          <div class="changelog-entry">
            <div class="changelog-entry-header">
              <span class="changelog-ver">${escapeHtml(entry.ver)}</span>
              <span class="changelog-date">${escapeHtml(entry.date)}</span>
            </div>
            <ul class="changelog-items">
              ${entry.items.map(item => `<li>${escapeHtml(item)}</li>`).join("")}
            </ul>
          </div>
        `).join("");
      });
    }

    let nextTabId = 1;
    let tabs = [];
    let activeTabId = null;
    const cheddarFavicon = "/loader/favicon.png";
    const searchEngines = {
      "https://duckduckgo.com/?q=%s": "DuckDuckGo",
      "https://www.google.com/search?q=%s": "Google",
      "https://search.brave.com/search?q=%s": "Brave",
      "https://www.bing.com/search?q=%s": "Bing",
    };

    function selectedSearchEngine() {
      const value = localStorage.getItem("searchEngine");
      if (Object.hasOwn(searchEngines, value)) return value;
      localStorage.setItem("searchEngine", "https://duckduckgo.com/?q=%s");
      return "https://duckduckgo.com/?q=%s";
    }

    function faviconForUrl(url) {
      if (!url || /^cheddar:\/\//i.test(url)) return cheddarFavicon;
      try {
        const origin = new URL(url, location.href).origin;
        if (origin === location.origin) return cheddarFavicon;
        return `https://www.google.com/s2/favicons?domain_url=${encodeURIComponent(origin)}&sz=32`;
      } catch {
        return cheddarFavicon;
      }
    }

    function makeBrowserTab() {
      const id = nextTabId++;
      return {
        id,
        kind: "browser",
        title: "New Tab",
        favicon: cheddarFavicon,
        history: ["cheddar://home"],
        historyIndex: 0,
      };
    }

    function makeAppTab(title, src, addr, faviconUrl = addr) {
      const id = nextTabId++;
      return { id, kind: "app", title, src, addr, favicon: faviconForUrl(faviconUrl) };
    }

    function currentTab() {
      return tabs.find(t => t.id === activeTabId);
    }

    const tabStrip = document.querySelector("#tab-strip");
    const viewport = document.querySelector("#viewport");
    const addressInput = document.querySelector("#address-input");
    const paneEls = {};

    function renderTabStrip() {
      tabStrip.innerHTML = "";
      tabs.forEach(tab => {
        const el = document.createElement("div");
        el.className = "tab" + (tab.id === activeTabId ? " active" : "");
        const favicon = document.createElement("img");
        favicon.className = "favicon";
        favicon.alt = "";
        favicon.src = tab.favicon || cheddarFavicon;
        favicon.addEventListener("error", () => { favicon.src = cheddarFavicon; }, { once: true });
        const title = document.createElement("span");
        title.className = "title";
        title.textContent = tab.title;
        const close = document.createElement("span");
        close.className = "close";
        close.textContent = "×";
        el.append(favicon, title, close);
        el.addEventListener("click", (e) => {
          if (e.target.classList.contains("close")) return;
          switchToTab(tab.id);
        });
        close.addEventListener("click", (e) => {
          e.stopPropagation();
          closeTab(tab.id);
        });
        tabStrip.appendChild(el);
      });
      const newBtn = document.createElement("div");
      newBtn.className = "tab-new";
      newBtn.textContent = "+";
      newBtn.addEventListener("click", () => {
        const tab = makeBrowserTab();
        tabs.push(tab);
        buildPane(tab);
        switchToTab(tab.id);
      });
      tabStrip.appendChild(newBtn);
    }

    function buildPane(tab) {
      const pane = document.createElement("div");
      pane.className = "pane";
      pane.id = "pane-" + tab.id;

      if (tab.kind === "browser") {
        const tpl = document.querySelector("#browser-pane-template");
        pane.appendChild(tpl.content.cloneNode(true));
        wireBrowserPane(tab, pane);
      } else if (tab.kind === "app") {
        const iframe = document.createElement("iframe");
        iframe.src = tab.src;
        pane.appendChild(iframe);
      }

      viewport.appendChild(pane);
      paneEls[tab.id] = pane;
    }

    function renderAnnouncement() {
      const el = document.querySelector("#global-announcement");
      if (!ANNOUNCEMENT_TEXT) {
        el.style.display = "none";
        el.innerHTML = "";
        return;
      }
      el.style.display = "flex";
      el.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        <span>${escapeHtml(`Notice: ${ANNOUNCEMENT_TEXT}`)}</span>
      `;
    }

    function renderFooter(pane) {
      const el = pane.querySelector("[data-footer]");
      if (!el) return;
      el.textContent = `CheddarOS™ — Protected by U.S. Copyright and DMCA.`;
    }

    function renderVersion(pane) {
      const el = pane.querySelector("[data-version]");
      if (!el) return;
      el.textContent = OS_VERSION;
    }

    const domainPattern = /^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+(:\d+)?(\/\S*)?$/i;

    function isCheddarCommand(value) {
      return /^cheddar:\/\//i.test(value);
    }

    function looksLikeAddress(value) {
      if (/^https?:\/\//i.test(value)) return true;
      if (/\s/.test(value)) return false;
      return domainPattern.test(value);
    }

    function toAbsoluteUrl(value) {
      return /^https?:\/\//i.test(value) ? value : `https://${value}`;
    }

    let proxyRouterPromise;
    async function proxyExternalUrl(url) {
      proxyRouterPromise ??= import("/proxy-assets/router.js?v=11");
      await proxyRouterPromise;
      if (typeof window.cheddarProxyOpen !== "function") {
        throw new Error("The proxy router did not initialize.");
      }
      return window.cheddarProxyOpen(url);
    }

    function omniboxDestination(raw) {
      const value = raw.trim();
      if (!value) return null;
      if (isCheddarCommand(value)) return { kind: "cheddar", url: value };
      if (looksLikeAddress(value)) {
        const url = toAbsoluteUrl(value);
        return { kind: "link", url, label: url.replace(/^https?:\/\//i, "").replace(/\/$/, "") };
      }
      return { kind: "search", query: value };
    }

    async function goToDestination(tab, raw) {
      const dest = omniboxDestination(raw);
      if (!dest) return;

      if (dest.kind === "cheddar") {
        const searchMatch = dest.url.match(/^cheddar:\/\/search\?q=(.*)$/i);
        if (searchMatch) {
          const query = new URLSearchParams(`q=${searchMatch[1]}`).get("q") || "";
          if (query) {
            return openProxyInTab(
              tab,
              selectedSearchEngine().replace("%s", encodeURIComponent(query)),
              dest.url,
              query
            );
          }
        }
        navigateBrowserTab(tab, dest.url);
        return true;
      }

      const url = dest.kind === "link" ? dest.url : selectedSearchEngine().replace("%s", encodeURIComponent(dest.query));
      const addr = dest.kind === "link" ? dest.url : `cheddar://search?q=${encodeURIComponent(dest.query)}`;
      const title = dest.kind === "link" ? dest.label : dest.query;

      return openProxyInTab(tab, url, addr, title);
    }

    async function openProxyInTab(tab, url, addr, title) {
      let proxiedUrl;
      try {
        proxiedUrl = await proxyExternalUrl(url);
      } catch (error) {
        console.error("Could not start proxied browser navigation:", error);
        const pane = paneEls[tab.id];
        if (tab.kind === "browser" && pane) {
          const frame = pane.querySelector("[data-proxy-frame]");
          if (frame) frame.style.display = "none";
          pane.querySelectorAll(".view").forEach(view => view.classList.remove("active"));
          pane.querySelector("#view-notfound").classList.add("active");
          pane.querySelector("[data-notfound-detail]").textContent =
            `The browser proxy could not start: ${error?.message || error}`;
          tab.title = "Proxy unavailable";
          tab.favicon = cheddarFavicon;
          tab.displayAddr = addr;
          tab.proxyUrl = null;
          if (tab.id === activeTabId) addressInput.value = addr;
          renderTabStrip();
        } else {
          window.alert("The browser proxy could not start. Please try again in a moment.");
        }
        return false;
      }

      if (tab.kind === "app") {
        tab.src = proxiedUrl;
        tab.addr = addr;
        tab.title = title;
        paneEls[tab.id].querySelector("iframe").src = proxiedUrl;
        if (tab.id === activeTabId) addressInput.value = addr;
        renderTabStrip();
        return true;
      }

      const pane = paneEls[tab.id];
      pane.querySelectorAll(".view").forEach(view => view.classList.remove("active"));
      let frame = pane.querySelector("[data-proxy-frame]");
      if (!frame) {
        frame = document.createElement("iframe");
        frame.dataset.proxyFrame = "";
        frame.title = title || "Proxied page";
        pane.appendChild(frame);
      }
      frame.style.display = "block";
      frame.src = proxiedUrl;
      tab.proxyUrl = proxiedUrl;
      tab.displayAddr = addr;
      tab.title = title;
      tab.favicon = faviconForUrl(url);
      if (tab.history[tab.historyIndex] !== url) {
        tab.history = tab.history.slice(0, tab.historyIndex + 1);
        tab.history.push(url);
        tab.historyIndex = tab.history.length - 1;
      }
      if (tab.id === activeTabId) addressInput.value = addr;
      renderTabStrip();
      updateNavButtons();
      return true;
    }

    function wireBrowserPane(tab, pane) {
      pane.querySelector('[data-app="games"]').addEventListener("click", () => openGamesTab());
      wireSettings(pane);
      pane.querySelector('[data-home-search]').addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        const input = e.target;
        const search = input.value;
        goToDestination(tab, search).then((navigated) => {
          if (navigated && input.isConnected) input.value = "";
        });
      });
      renderChangelog(pane);
      renderFooter(pane);
      renderVersion(pane);
    }

    function wireSettings(pane) {
      const transport = pane.querySelector('[data-setting="transport"]');
      const backend = pane.querySelector('[data-setting="backend"]');
      const searchEngine = pane.querySelector('[data-setting="search-engine"]');
      const status = pane.querySelector("[data-settings-status]");
      const savedTransport = localStorage.getItem("proxy-transport");
      transport.value = ["bare", "epoxy", "libcurl"].includes(savedTransport) ? savedTransport : "bare";
      backend.value = localStorage.getItem("proxy-backend") === "scramjet" || localStorage.getItem("proxyType") === "SJ" ? "scramjet" : "uv";
      searchEngine.value = selectedSearchEngine();

      transport.addEventListener("change", async () => {
        const requested = transport.value;
        status.textContent = "Applying transport…";
        transport.disabled = true;
        try {
          proxyRouterPromise ??= import("/proxy-assets/router.js?v=11");
          const router = await proxyRouterPromise;
          await router.configureTransport(requested);
          status.textContent = `Transport active: ${requested === "bare" ? "Bare Server" : requested}.`;
        } catch (error) {
          const saved = localStorage.getItem("proxy-transport");
          transport.value = ["bare", "epoxy", "libcurl"].includes(saved) ? saved : "bare";
          status.textContent = `Could not apply transport: ${error?.message || error}`;
        } finally {
          transport.disabled = false;
        }
      });

      backend.addEventListener("change", () => {
        const value = backend.value;
        localStorage.setItem("proxy-backend", value);
        localStorage.setItem("proxyType", value === "scramjet" ? "SJ" : "UV");
        status.textContent = `Backend saved: ${value === "uv" ? "Ultraviolet" : "Scramjet"}.`;
      });

      searchEngine.addEventListener("change", () => {
        localStorage.setItem("searchEngine", searchEngine.value);
        status.textContent = `Search engine saved: ${searchEngines[searchEngine.value]}.`;
      });
    }

    function switchToTab(id) {
      activeTabId = id;
      Object.values(paneEls).forEach(p => p.classList.remove("active"));
      paneEls[id].classList.add("active");
      renderTabStrip();
      syncToolbarForActiveTab();
    }

    function closeTab(id) {
      const idx = tabs.findIndex(t => t.id === id);
      if (idx === -1) return;
      const pane = paneEls[id];
      if (pane) pane.remove();
      delete paneEls[id];
      tabs.splice(idx, 1);

      if (tabs.length === 0) {
        const tab = makeBrowserTab();
        tabs.push(tab);
        buildPane(tab);
        switchToTab(tab.id);
        return;
      }

      if (activeTabId === id) {
        const next = tabs[idx] || tabs[idx - 1] || tabs[0];
        switchToTab(next.id);
      } else {
        renderTabStrip();
      }
    }

    function openGamesTab() {
      const tab = makeAppTab("CheddarGames", "core/games.html", "cheddar://games");
      tabs.push(tab);
      buildPane(tab);
      switchToTab(tab.id);
    }

    function navigateBrowserTab(tab, url, addToHistory = true) {
      url = url.trim();
      if (/^https?:\/\//i.test(url)) {
        void openProxyInTab(tab, url, url.replace(/^https?:\/\//i, "").replace(/\/$/, ""), url);
        return;
      }
      const pane = paneEls[tab.id];
      const frame = pane.querySelector("[data-proxy-frame]");
      if (frame) frame.style.display = "none";
      pane.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      tab.proxyUrl = null;
      tab.displayAddr = null;
      tab.favicon = cheddarFavicon;

      if (url === "cheddar://home") {
        pane.querySelector("#view-home").classList.add("active");
        tab.title = "New Tab";
      } else if (url === "cheddar://settings") {
        pane.querySelector("#view-settings").classList.add("active");
        tab.title = "Settings";
      } else if (url === "cheddar://changelog") {
        pane.querySelector("#view-changelog").classList.add("active");
        tab.title = "Change Logs";
      } else {
        pane.querySelector("[data-notfound-detail]").textContent = `CheddarOS couldn't find "${url}".`;
        pane.querySelector("#view-notfound").classList.add("active");
        tab.title = "Not found";
      }

      if (addToHistory) {
        tab.history = tab.history.slice(0, tab.historyIndex + 1);
        tab.history.push(url);
        tab.historyIndex = tab.history.length - 1;
      }

      if (tab.id === activeTabId) {
        addressInput.value = url;
        renderTabStrip();
        updateNavButtons();
      }
    }

    function syncToolbarForActiveTab() {
      const tab = currentTab();
      if (!tab) return;
      if (tab.kind === "browser") {
        addressInput.value = tab.displayAddr || tab.history[tab.historyIndex];
      } else {
        addressInput.value = tab.addr;
      }
      updateNavButtons();
    }

    function updateNavButtons() {
      const tab = currentTab();
      const backBtn = document.querySelector("#back-btn");
      const fwdBtn = document.querySelector("#fwd-btn");
      if (!tab || tab.kind !== "browser") {
        backBtn.classList.add("disabled");
        fwdBtn.classList.add("disabled");
        return;
      }
      backBtn.classList.toggle("disabled", tab.historyIndex <= 0);
      fwdBtn.classList.toggle("disabled", tab.historyIndex >= tab.history.length - 1);
    }

    document.querySelector("#back-btn").addEventListener("click", () => {
      const tab = currentTab();
      if (!tab || tab.kind !== "browser") return;
      if (tab.historyIndex > 0) { tab.historyIndex--; navigateBrowserTab(tab, tab.history[tab.historyIndex], false); }
    });
    document.querySelector("#fwd-btn").addEventListener("click", () => {
      const tab = currentTab();
      if (!tab || tab.kind !== "browser") return;
      if (tab.historyIndex < tab.history.length - 1) { tab.historyIndex++; navigateBrowserTab(tab, tab.history[tab.historyIndex], false); }
    });
    document.querySelector("#reload-btn").addEventListener("click", () => {
      const tab = currentTab();
      if (!tab) return;
      if (tab.kind === "browser") {
        if (tab.proxyUrl) {
          const frame = paneEls[tab.id].querySelector("[data-proxy-frame]");
          if (frame) frame.src = tab.proxyUrl;
        } else {
          navigateBrowserTab(tab, tab.history[tab.historyIndex], false);
        }
      } else {
        const iframe = paneEls[tab.id].querySelector("iframe");
        iframe.src = iframe.src;
      }
    });
    document.querySelector("#home-btn").addEventListener("click", () => {
      const tab = currentTab();
      if (tab && tab.kind === "browser") navigateBrowserTab(tab, "cheddar://home");
    });
    document.querySelector("#settings-btn").addEventListener("click", () => {
      const tab = currentTab();
      if (tab && tab.kind === "browser") navigateBrowserTab(tab, "cheddar://settings");
    });
    document.querySelector("#bookmark-changelog").addEventListener("click", () => {
      const tab = currentTab();
      if (tab && tab.kind === "browser") navigateBrowserTab(tab, "cheddar://changelog");
    });

    addressInput.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const tab = currentTab();
      if (tab) goToDestination(tab, addressInput.value);
    });

    renderAnnouncement();
    const initialTab = makeBrowserTab();
    tabs.push(initialTab);
    buildPane(initialTab);
    activeTabId = initialTab.id;
    paneEls[initialTab.id].classList.add("active");
    renderTabStrip();
    syncToolbarForActiveTab();
  </script>
</body>
</html>
