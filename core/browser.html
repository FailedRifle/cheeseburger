<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg-app: #131415;
      --bg-surface: #191a1c;
      --bg-elevated: #222325;
      --bg-elevated-2: #2b2c2f;
      --border: #2d2e31;
      --border-soft: #1e1f21;
      --text: #e8eaed;
      --text-dim: #9aa0a6;
      --text-faint: #6b6e73;
      --accent: #eab23d;
      --accent-strong: #f5c563;
    }
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background-color: var(--bg-app);
      color: var(--text);
    }

    .browser {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      background: var(--bg-app);
    }

    /* Tabs */
    .tab-strip {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      background: var(--bg-app);
      padding: 8px 8px 0;
      overflow-x: auto;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      background: var(--bg-app);
      border-radius: 8px 8px 0 0;
      font-size: 13px;
      color: var(--text-dim);
      max-width: 200px;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: background 0.1s ease;
    }
    .tab:hover { background: var(--bg-surface); }
    .tab.active { background: var(--bg-surface); color: var(--text); }
    .tab.active::after {
      content: "";
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 2px;
      border-radius: 8px 8px 0 0;
      background: var(--accent);
    }
    .tab .favicon { width: 8px; height: 8px; border-radius: 2px; background: var(--text-faint); flex-shrink: 0; }
    .tab .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab .close {
      display: flex; align-items: center; justify-content: center;
      width: 18px; height: 18px;
      color: var(--text-faint); font-size: 14px; line-height: 1;
      border-radius: 4px; flex-shrink: 0;
    }
    .tab .close:hover { color: var(--text); background: var(--bg-elevated-2); }
    .tab-new {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px;
      color: var(--text-faint); flex-shrink: 0; cursor: pointer;
      border-radius: 6px;
    }
    .tab-new:hover { color: var(--text); background: var(--bg-surface); }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-soft);
      position: relative;
    }
    .nav-btn {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border-radius: 50%;
      color: var(--text-dim);
      flex-shrink: 0;
      user-select: none;
    }
    .nav-btn:hover { background: var(--bg-elevated-2); color: var(--text); }
    .nav-btn.disabled { opacity: 0.35; pointer-events: none; }
    .nav-btn svg { width: 17px; height: 17px; }
    .address-bar {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      margin: 0 4px;
      background: var(--bg-elevated);
      border: 1px solid transparent;
      border-radius: 20px;
      color: var(--text-dim);
      transition: border-color 0.1s ease;
    }
    .address-bar:focus-within { border-color: var(--accent); }
    .address-bar .lock { display: flex; color: #7fbf7f; flex-shrink: 0; }
    .address-bar .lock svg { width: 13px; height: 13px; }
    .address-bar input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
    }
    .toolbar-icon {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      flex-shrink: 0;
      user-select: none;
      border-radius: 50%;
    }
    .toolbar-icon svg { width: 16px; height: 16px; }
    .toolbar-icon:hover { color: var(--text); background: var(--bg-elevated-2); }

    .bookmarks-bar {
      display: flex;
      gap: 4px;
      padding: 4px 10px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-soft);
      font-size: 12px;
      color: var(--text-dim);
    }
    .bookmark {
      padding: 5px 10px;
      border-radius: 6px;
      cursor: default;
    }
    .bookmark.is-link { cursor: pointer; }
    .bookmark.is-link:hover { background: var(--bg-elevated-2); color: var(--text); }

    /* Viewport */
    .viewport {
      flex: 1;
      background: var(--bg-app);
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
    }
    .pane { display: none; height: 100%; width: 100%; align-items: stretch; }
    .pane.active { display: flex; }
    .pane iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: var(--bg-app);
    }

    .view { display: none; height: 100%; width: 100%; }
    .view.active { display: flex; flex: 1; }

    /* Home view */
    #view-home { align-items: center; justify-content: center; position: relative; }
    .announcement-banner {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #7a1245;
      border-bottom: 3px solid #e0308c;
      color: #fff;
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.1px;
      text-align: center;
      padding: 10px 16px;
      flex-shrink: 0;
    }
    .announcement-banner svg { width: 15px; height: 15px; flex-shrink: 0; }
    .homepage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 20px;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      box-sizing: border-box;
    }
    .logo-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .logo { font-size: 44px; font-weight: 600; letter-spacing: -0.5px; color: var(--text); line-height: 1; }
    .logo span { color: var(--accent); }
    .version-tag { font-size: 11px; color: var(--text-faint); }
    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 560px;
      max-width: 80vw;
      padding: 12px 20px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 24px;
      color: var(--text-dim);
      font-size: 14px;
      transition: border-color 0.1s ease, box-shadow 0.1s ease;
    }
    .search-box:hover { border-color: #4d4e52; box-shadow: 0 1px 6px rgba(0,0,0,0.3); }
    .search-box:focus-within { border-color: var(--accent); box-shadow: 0 1px 6px rgba(0,0,0,0.3); }
    .search-box .search-icon { display: flex; color: var(--text-faint); flex-shrink: 0; }
    .search-box .search-icon svg { width: 16px; height: 16px; }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }
    .search-box input::placeholder { color: var(--text-dim); }

    .apps-section {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .apps-label { font-size: 12px; color: var(--text-faint); }
    .apps-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 26px; }
    .app { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; width: 64px; }
    .app .app-icon {
      width: 52px; height: 52px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; background: var(--bg-elevated);
      border: 1px solid var(--border);
      transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
    }
    .app:hover .app-icon { background: var(--bg-elevated-2); border-color: var(--accent); transform: scale(1.05); }
    .app .app-label { font-size: 11px; color: var(--text-dim); text-align: center; }

    .site-footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      font-size: 11px;
      color: var(--text-faint);
      text-align: center;
    }

    /* Generic page */
    #view-settings { align-items: flex-start; justify-content: flex-start; }
    .page { width: 100%; padding: 28px 48px; }
    .page h2 { font-size: 19px; color: var(--text); margin: 0 0 22px; font-weight: 600; }
    .empty-note { color: var(--text-faint); font-size: 14px; }

    /* Changelog view */
    #view-changelog { align-items: flex-start; justify-content: flex-start; }
    .changelog-page { max-width: 720px; }
    .changelog-list { display: flex; flex-direction: column; gap: 16px; }
    .changelog-entry {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 16px 20px;
    }
    .changelog-entry-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .changelog-ver { font-size: 14px; font-weight: 600; color: var(--text); }
    .changelog-date { font-size: 12px; color: var(--text-faint); white-space: nowrap; }
    .changelog-items { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
    .changelog-items li { font-size: 13px; color: var(--text-dim); line-height: 1.45; }
  </style>
  <script src="/proxy-assets/uv/uv.bundle.js"></script>
  <script src="/proxy-assets/uv/uv.config.js"></script>
</head>
<body>

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function renderChangelog(pane) {
      const list = pane.querySelector("[data-changelog-list]");
      list.innerHTML = changelogData.map(entry => `
        <div class="changelog-entry">
          <div class="changelog-entry-header">
            <span class="changelog-ver">${escapeHtml(entry.ver)}</span>
            <span class="changelog-date">${escapeHtml(entry.date)}</span>
          </div>
          <ul class="changelog-items">
            ${entry.items.map(item => `<li>${escapeHtml(item)}</li>`).join("")}
          </ul>
        </div>
      `).join("");
    }

    let nextTabId = 1;
    let tabs = [];
    let activeTabId = null;

    function makeBrowserTab() {
      const id = nextTabId++;
      return {
        id,
        kind: "browser",
        title: "New Tab",
        history: ["cheddar://home"],
        historyIndex: 0,
      };
    }

    function makeAppTab(title, src, addr) {
      const id = nextTabId++;
      return { id, kind: "app", title, src, addr };
    }

    function currentTab() {
      return tabs.find(t => t.id === activeTabId);
    }

    const tabStrip = document.querySelector("#tab-strip");
    const viewport = document.querySelector("#viewport");
    const addressInput = document.querySelector("#address-input");
    const paneEls = {};

    function renderTabStrip() {
      tabStrip.innerHTML = "";
      tabs.forEach(tab => {
        const el = document.createElement("div");
        el.className = "tab" + (tab.id === activeTabId ? " active" : "");
        el.innerHTML = `
          <span class="favicon"></span>
          <span class="title">${tab.title}</span>
          <span class="close">×</span>
        `;
        el.addEventListener("click", (e) => {
          if (e.target.classList.contains("close")) return;
          switchToTab(tab.id);
        });
        el.querySelector(".close").addEventListener("click", (e) => {
          e.stopPropagation();
          closeTab(tab.id);
        });
        tabStrip.appendChild(el);
      });
      const newBtn = document.createElement("div");
      newBtn.className = "tab-new";
      newBtn.textContent = "+";
      newBtn.addEventListener("click", () => {
        const tab = makeBrowserTab();
        tabs.push(tab);
        buildPane(tab);
        switchToTab(tab.id);
      });
      tabStrip.appendChild(newBtn);
    }

    function buildPane(tab) {
      const pane = document.createElement("div");
      pane.className = "pane";
      pane.id = "pane-" + tab.id;

      if (tab.kind === "browser") {
        const tpl = document.querySelector("#browser-pane-template");
        pane.appendChild(tpl.content.cloneNode(true));
        wireBrowserPane(tab, pane);
      } else if (tab.kind === "app") {
        const iframe = document.createElement("iframe");
        iframe.src = tab.src;
        pane.appendChild(iframe);
      }

      viewport.appendChild(pane);
      paneEls[tab.id] = pane;
    }

    function renderAnnouncement() {
      const el = document.querySelector("#global-announcement");
      if (!ANNOUNCEMENT_TEXT) {
        el.style.display = "none";
        el.innerHTML = "";
        return;
      }
      el.style.display = "flex";
      el.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        <span>${escapeHtml(`Notice: ${ANNOUNCEMENT_TEXT}`)}</span>
      `;
    }

    function renderFooter(pane) {
      const el = pane.querySelector("[data-footer]");
      if (!el) return;
      el.textContent = `CheddarOS™ — Protected by U.S. Copyright and DMCA.`;
    }

    function renderVersion(pane) {
      const el = pane.querySelector("[data-version]");
      if (!el) return;
      el.textContent = OS_VERSION;
    }

    function isCheddarCommand(value) {
      return /^cheddar:\/\//i.test(value.trim());
    }

    async function handleSearch(tab, rawValue) {
      const value = rawValue.trim();
      if (!value) return;

      // Typing a cheddar:// command into the search box behaves like the
      // address bar rather than firing off a web search.
      if (isCheddarCommand(value)) {
        navigateBrowserTab(tab, value);
        if (tab.id === activeTabId) addressInput.value = value;
        return;
      }

      // Search results are opened through the selected proxy backend.
      const query = encodeURIComponent(value);
      const destination = `https://duckduckgo.com/?q=${query}`;
      const proxied = await window.cheddarProxyOpen?.(destination) || destination;
      const searchTab = makeAppTab(
        value,
        proxied,
        `cheddar://search?q=${query}`
      );
      tabs.push(searchTab);
      buildPane(searchTab);
      switchToTab(searchTab.id);
    }

    function wireBrowserPane(tab, pane) {
      pane.querySelector('[data-app="games"]').addEventListener("click", () => openGamesTab());
      pane.querySelector('[data-home-search]').addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        handleSearch(tab, e.target.value).catch(console.error);
        e.target.value = "";
      });
      renderChangelog(pane);
      renderFooter(pane);
      renderVersion(pane);
    }

    function switchToTab(id) {
      activeTabId = id;
      Object.values(paneEls).forEach(p => p.classList.remove("active"));
      paneEls[id].classList.add("active");
      renderTabStrip();
      syncToolbarForActiveTab();
    }

    function closeTab(id) {
      const idx = tabs.findIndex(t => t.id === id);
      if (idx === -1) return;
      const pane = paneEls[id];
      if (pane) pane.remove();
      delete paneEls[id];
      tabs.splice(idx, 1);

      if (tabs.length === 0) {
        const tab = makeBrowserTab();
        tabs.push(tab);
        buildPane(tab);
        switchToTab(tab.id);
        return;
      }

      if (activeTabId === id) {
        const next = tabs[idx] || tabs[idx - 1] || tabs[0];
        switchToTab(next.id);
      } else {
        renderTabStrip();
      }
    }

    function openGamesTab() {
      const tab = makeAppTab("CheddarGames", "core/games.html", "cheddar://games");
      tabs.push(tab);
      buildPane(tab);
      switchToTab(tab.id);
    }

    function navigateBrowserTab(tab, url, addToHistory = true) {
      url = url.trim();
      const pane = paneEls[tab.id];
      pane.querySelectorAll(".view").forEach(v => v.classList.remove("active"));

      if (url === "cheddar://home") {
        pane.querySelector("#view-home").classList.add("active");
        tab.title = "New Tab";
      } else if (url === "cheddar://settings") {
        pane.querySelector("#view-settings").classList.add("active");
        tab.title = "Settings";
      } else if (url === "cheddar://changelog") {
        pane.querySelector("#view-changelog").classList.add("active");
        tab.title = "Change Logs";
      } else {
        pane.querySelector("[data-notfound-detail]").textContent = `CheddarOS couldn't find "${url}".`;
        pane.querySelector("#view-notfound").classList.add("active");
        tab.title = "Not found";
      }

      if (addToHistory) {
        tab.history = tab.history.slice(0, tab.historyIndex + 1);
        tab.history.push(url);
        tab.historyIndex = tab.history.length - 1;
      }

      if (tab.id === activeTabId) {
        addressInput.value = url;
        renderTabStrip();
        updateNavButtons();
      }
    }

    function syncToolbarForActiveTab() {
      const tab = currentTab();
      if (!tab) return;
      if (tab.kind === "browser") {
        addressInput.value = tab.history[tab.historyIndex];
      } else {
        addressInput.value = tab.addr;
      }
      updateNavButtons();
    }

    function updateNavButtons() {
      const tab = currentTab();
      const backBtn = document.querySelector("#back-btn");
      const fwdBtn = document.querySelector("#fwd-btn");
      if (!tab || tab.kind !== "browser") {
        backBtn.classList.add("disabled");
        fwdBtn.classList.add("disabled");
        return;
      }
      backBtn.classList.toggle("disabled", tab.historyIndex <= 0);
      fwdBtn.classList.toggle("disabled", tab.historyIndex >= tab.history.length - 1);
    }

    document.querySelector("#back-btn").addEventListener("click", () => {
      const tab = currentTab();
      if (!tab || tab.kind !== "browser") return;
      if (tab.historyIndex > 0) { tab.historyIndex--; navigateBrowserTab(tab, tab.history[tab.historyIndex], false); }
    });
    document.querySelector("#fwd-btn").addEventListener("click", () => {
      const tab = currentTab();
      if (!tab || tab.kind !== "browser") return;
      if (tab.historyIndex < tab.history.length - 1) { tab.historyIndex++; navigateBrowserTab(tab, tab.history[tab.historyIndex], false); }
    });
    document.querySelector("#reload-btn").addEventListener("click", () => {
      const tab = currentTab();
      if (!tab) return;
      if (tab.kind === "browser") {
        navigateBrowserTab(tab, tab.history[tab.historyIndex], false);
      } else {
        const iframe = paneEls[tab.id].querySelector("iframe");
        iframe.src = iframe.src;
      }
    });
    document.querySelector("#home-btn").addEventListener("click", () => {
      const tab = currentTab();
      if (tab && tab.kind === "browser") navigateBrowserTab(tab, "cheddar://home");
    });
    document.querySelector("#settings-btn").addEventListener("click", () => {
      const tab = currentTab();
      if (tab && tab.kind === "browser") navigateBrowserTab(tab, "cheddar://settings");
    });
    document.querySelector("#bookmark-changelog").addEventListener("click", () => {
      const tab = currentTab();
      if (tab && tab.kind === "browser") navigateBrowserTab(tab, "cheddar://changelog");
    });

    addressInput.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const tab = currentTab();
      if (tab && tab.kind === "browser") {
        handleSearch(tab, addressInput.value).catch(console.error);
      }
    });

    renderAnnouncement();
    const initialTab = makeBrowserTab();
    tabs.push(initialTab);
    buildPane(initialTab);
    activeTabId = initialTab.id;
    paneEls[initialTab.id].classList.add("active");
    renderTabStrip();
    syncToolbarForActiveTab();
  </script>
  <script type="module" src="/proxy-assets/router.js?v=6"></script>
</body>
</html>
