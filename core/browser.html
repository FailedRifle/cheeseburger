<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CheddarOS</title>
  <link rel="icon" id="app-window-favicon" href="/loader/favicon.png" type="image/png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #121212;
      --sidebar-bg: #0f0f0f;
      --panel-bg: #1a1a1a;
      --card-bg: #1e1e1e;
      --border: #333333;
      --border-hover: #555555;
      --text: #e0e0e0;
      --text-dim: #999999;
      --text-muted: #676767;
      --accent: #ffffff;
      --red: #ff5252;
      --green: #4caf50;
      --yellow: #ffd700;
      --notice-bg: #1c1c1c;
      --notice-border: #ffffff;
      --notice-text: #ffffff;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: monospace;
    }
    html, body {
      height: 100%;
      margin: 0;
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .browser {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .tab-strip {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      background: var(--sidebar-bg);
      padding: 6px 8px 0;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tab-strip::-webkit-scrollbar { height: 3px; }
    .tab-strip::-webkit-scrollbar-thumb { background: var(--border); }
    .tab {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      background: var(--sidebar-bg);
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      max-width: 200px;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: background 0.1s, color 0.1s;
    }
    .tab:hover { background: var(--panel-bg); color: var(--text); }
    .tab.active {
      background: var(--panel-bg);
      color: var(--accent);
      font-weight: 600;
      border-color: var(--border);
    }
    .tab.active::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: -1px;
      height: 2px;
      background: var(--accent);
    }
    .tab .favicon {
      width: 14px; height: 14px;
      border-radius: 2px;
      object-fit: contain;
      flex-shrink: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
    }
    .tab .title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .tab .close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px; height: 16px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1;
      border-radius: 3px;
      flex-shrink: 0;
      transition: color 0.1s, background 0.1s;
    }
    .tab .close:hover {
      color: var(--accent);
      background: var(--card-bg);
    }
    .tab-new {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px; height: 28px;
      color: var(--text-muted);
      flex-shrink: 0;
      cursor: pointer;
      border-radius: 4px;
      font-size: 16px;
      transition: color 0.1s, background 0.1s;
    }
    .tab-new:hover {
      color: var(--accent);
      background: var(--panel-bg);
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      position: relative;
      flex-shrink: 0;
    }
    .nav-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--text-dim);
      flex-shrink: 0;
      user-select: none;
      cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    .nav-btn:hover {
      background: var(--card-bg);
      color: var(--accent);
      border-color: var(--border);
    }
    .nav-btn.disabled {
      opacity: 0.35;
      pointer-events: none;
    }
    .nav-btn svg { width: 15px; height: 15px; }
    .address-bar {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      margin: 0 4px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-dim);
      transition: border-color 0.15s;
    }
    .address-bar:focus-within { border-color: var(--border-hover); }
    .address-bar .lock {
      display: flex;
      color: var(--green);
      flex-shrink: 0;
    }
    .address-bar .lock svg { width: 12px; height: 12px; }
    .address-bar input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 12px;
      font-family: var(--mono);
    }
    .toolbar-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      flex-shrink: 0;
      user-select: none;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    .toolbar-icon svg { width: 14px; height: 14px; }
    .toolbar-icon:hover {
      color: var(--accent);
      background: var(--card-bg);
      border-color: var(--border);
    }
    .bookmarks-bar {
      display: flex;
      gap: 2px;
      padding: 4px 10px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-dim);
      flex-shrink: 0;
    }
    .bookmark {
      padding: 4px 10px;
      border-radius: 4px;
      cursor: default;
      font-weight: 500;
      transition: background 0.1s, color 0.1s;
    }
    .bookmark.is-link { cursor: pointer; }
    .bookmark.is-link:hover {
      background: var(--card-bg);
      color: var(--accent);
    }
    .viewport {
      flex: 1;
      background: var(--bg);
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      min-height: 0;
    }
    .viewport::-webkit-scrollbar { width: 5px; }
    .viewport::-webkit-scrollbar-thumb { background: var(--border); }
    .pane {
      display: none;
      height: 100%;
      width: 100%;
      align-items: stretch;
    }
    .pane.active { display: flex; }
    .pane iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: var(--bg);
    }
    .view {
      display: none;
      height: 100%;
      width: 100%;
    }
    .view.active { display: flex; flex: 1; }
    #view-home {
      align-items: center;
      justify-content: center;
      position: relative;
      flex-direction: column;
    }
    .announcement-banner {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--notice-bg);
      border-bottom: 1px solid var(--notice-border);
      border-top: 1px solid var(--notice-border);
      color: var(--notice-text);
      font-family: var(--mono);
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.3px;
      text-align: center;
      padding: 5px 16px;
      flex-shrink: 0;
    }
    .announcement-banner svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }
    .homepage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 24px;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      box-sizing: border-box;
    }
    .logo-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .logo {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--accent);
      line-height: 1;
    }
    .logo span { color: var(--accent); }
    .version-tag {
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--mono);
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 520px;
      max-width: 85vw;
      padding: 10px 16px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-dim);
      font-size: 13px;
      transition: border-color 0.15s;
    }
    .search-box:hover { border-color: var(--border-hover); }
    .search-box:focus-within { border-color: var(--border-hover); }
    .search-box .search-icon {
      display: flex;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .search-box .search-icon svg { width: 14px; height: 14px; }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      font-family: var(--font);
    }
    .search-box input::placeholder { color: var(--text-muted); }
    .apps-section {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .apps-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-family: var(--mono);
    }
    .apps-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      width: 64px;
    }
    .app .app-icon {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      transition: border-color 0.15s, background 0.15s;
    }
    .app:hover .app-icon {
      background: var(--card-bg);
      border-color: var(--border-hover);
    }
    .app .app-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-dim);
      text-align: center;
    }
    .site-footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 16px;
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
      font-family: var(--mono);
    }
    #view-settings {
      align-items: flex-start;
      justify-content: flex-start;
    }
    .page {
      width: 100%;
      padding: 18px 24px;
    }
    .page h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      margin: 0 0 16px;
    }
    .empty-note {
      color: var(--text-muted);
      font-size: 12px;
    }
    .settings-list {
      width: min(680px, 100%);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .settings-section-title {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      display: inline-block;
      padding: 4px 14px;
      margin-bottom: 4px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
      border-radius: 4px;
    }
    .settings-group {
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--panel-bg);
      overflow: hidden;
    }
    .setting-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-bg);
    }
    .settings-group .setting-card:last-child { border-bottom: none; }
    .setting-copy {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .setting-title {
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
    }
    .setting-description,
    .setting-status {
      color: var(--text-dim);
      font-size: 10px;
      line-height: 1.5;
    }
    .setting-card select {
      min-width: 200px;
      padding: 6px 10px;
      color: var(--text);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
      outline: none;
    }
    .setting-card select:focus { border-color: var(--border-hover); }
    .setting-card select option { background: var(--card-bg); }
    .setting-card .setting-action {
      min-width: 200px;
      padding: 7px 12px;
      color: var(--accent);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--font);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .setting-card .setting-action:hover { border-color: var(--border-hover); }
    .setting-status {
      min-height: 16px;
      margin: 2px 0 0;
      padding: 0 4px;
      font-family: var(--mono);
    }
    @media (max-width: 620px) {
      .page { padding: 14px 16px; }
      .setting-card {
        align-items: stretch;
        flex-direction: column;
        gap: 10px;
      }
      .setting-card select,
      .setting-card .setting-action { width: 100%; min-width: 0; }
    }
    #view-changelog {
      align-items: flex-start;
      justify-content: flex-start;
    }
    .changelog-page { max-width: 720px; }
    .changelog-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .changelog-entry {
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
    }
    .changelog-entry:first-child { padding-top: 0; }
    .changelog-entry-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
    }
    .changelog-ver {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      font-family: var(--mono);
    }
    .changelog-date {
      font-size: 10px;
      color: var(--text-muted);
    }
    .changelog-items {
      margin: 0;
      padding-left: 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .changelog-items li {
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.65;
    }
  </style>
</head>
<body>
  <div class="browser">
    <div class="announcement-banner" id="global-announcement" style="display:none;"></div>
    <div class="tab-strip" id="tab-strip"></div>
    <div class="toolbar">
      <div class="nav-btn" id="back-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></div>
      <div class="nav-btn" id="fwd-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></div>
      <div class="nav-btn" id="reload-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><polyline points="21 3 21 9 15 9"></polyline></svg></div>
      <div class="nav-btn" id="home-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10h14V10"></path></svg></div>
      <div class="address-bar">
        <span class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg></span>
        <input type="text" id="address-input" value="cheddar://home" spellcheck="false">
      </div>
      <div class="toolbar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.1 8.6 22 9.3 17 14.1 18.2 21 12 17.6 5.8 21 7 14.1 2 9.3 8.9 8.6 12 2"></polygon></svg></div>
      <div class="toolbar-icon" id="settings-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 0 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 0 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z"></path></svg></div>
    </div>
    <div class="bookmarks-bar">
      <span class="bookmark">Cheddar</span>
      <span class="bookmark">On top</span>
      <span class="bookmark is-link" id="bookmark-changelog">Change logs</span>
    </div>
    <div class="viewport" id="viewport"></div>
  </div>
  <template id="browser-pane-template">
    <div class="view active" id="view-home">
      <div class="homepage">
        <div class="logo-group">
          <div class="logo">Cheddar<span>OS</span></div>
          <div class="version-tag" data-version></div>
        </div>
        <div class="search-box">
          <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
          <input type="text" data-home-search placeholder="Search on CheddarOS" spellcheck="false">
        </div>
        <div class="apps-section">
          <div class="apps-label">Apps</div>
          <div class="apps-row">
            <div class="app" data-app="games"><div class="app-icon">🎮</div><div class="app-label">cheddargames</div></div>
          </div>
        </div>
      </div>
      <div class="site-footer" data-footer></div>
    </div>
    <div class="view" id="view-settings">
      <div class="page">
        <h2>Settings</h2>
        <div class="settings-list">
          <h3 class="settings-section-title">Proxy</h3>
          <div class="settings-group">
            <label class="setting-card">
              <span class="setting-copy"><span class="setting-title">Transport</span><span class="setting-description">Choose how the proxy connects to websites.</span></span>
              <select data-setting="transport" aria-label="Transport">
                <option value="bare">Bare Server (Default)</option>
                <option value="epoxy">Epoxy</option>
                <option value="libcurl">Libcurl</option>
              </select>
            </label>
            <label class="setting-card">
              <span class="setting-copy"><span class="setting-title">Backend</span><span class="setting-description">Choose the browser proxy engine.</span></span>
              <select data-setting="backend" aria-label="Backend">
                <option value="uv">Ultraviolet (Default)</option>
                <option value="scramjet">Scramjet (Janky)</option>
              </select>
            </label>
            <label class="setting-card">
              <span class="setting-copy"><span class="setting-title">Search Engine</span><span class="setting-description">Choose where text searches are sent. DuckDuckGo uses Epoxy when Bare Server is selected.</span></span>
              <select data-setting="search-engine" aria-label="Search Engine">
                <option value="https://duckduckgo.com/?q=%s">DuckDuckGo (Default)</option>
                <option value="https://www.google.com/search?q=%s">Google</option>
                <option value="https://search.brave.com/search?q=%s">Brave</option>
                <option value="https://www.bing.com/search?q=%s">Bing</option>
              </select>
            </label>
          </div>
          <p class="setting-status" data-settings-status aria-live="polite"></p>
          <h3 class="settings-section-title">Cloaking</h3>
          <div class="settings-group">
            <label class="setting-card">
              <span class="setting-copy"><span class="setting-title">Browser title and favicon</span><span class="setting-description">Changes the page title and browser favicon. Installed app windows keep their CheddarOS name and app icon; use New Chrome tab or This tab to see the selected cloak.</span></span>
              <select data-setting="cloak" aria-label="Browser title and favicon">
                <option value="default">CheddarOS (Default)</option>
                <option value="classroom">Google Classroom</option>
                <option value="docs">Google Docs</option>
                <option value="drive">Google Drive</option>
                <option value="genesis">Genesis</option>
                <option value="gmail">Gmail</option>
                <option value="slides">Google Slides</option>
              </select>
            </label>
            <label class="setting-card">
              <span class="setting-copy"><span class="setting-title">Open CheddarOS in</span><span class="setting-description">Choose whether the app opens in a separate window, Chrome tab, this tab, or a tab inside CheddarOS.</span></span>
              <select data-setting="launch-mode" aria-label="Open CheddarOS in">
                <option value="window">New window (about:blank)</option>
                <option value="chrome-tab">New Chrome tab</option>
                <option value="normal-tab">This tab</option>

    <div class="view" id="view-changelog">

  <script>

    let nextTabId = 1;

      docs: { title: "Google Docs", icon: "/core/images/cloakicons/docs.ico", type: "image/x-icon" },
      drive: { title: "Google Drive", icon: "/core/images/cloakicons/drive.ico", type: "image/x-icon" },
      genesis: { title: "Genesis", icon: "/core/images/cloakicons/genesis.ico", type: "image/x-icon" },
      gmail: { title: "Gmail", icon: "/core/images/cloakicons/gmail.ico", type: "image/x-icon" },

    }
    function makeBrowserTab() {

        history: ["cheddar://home"],
        historyIndex: 0,

    }

    const tabStrip = document.querySelector("#tab-strip");

    }
    function renderFooter(pane) {

    }
    function renderVersion(pane) {
      const el = pane.querySelector("[data-version]");
      if (!el) return;
      el.textContent = OS_VERSION;
    }
    const domainPattern = /^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+(:\d+)?(\/\S*)?$/i;
    function isCheddarCommand(value) {

    }
    function looksLikeAddress(value) {

    }

    }
    function omniboxDestination(raw) {

        const url = toAbsoluteUrl(value);
        return { kind: "link", url, label: url.replace(/^https?:\/\//i, "").replace(/\/$/, "") };
      }

    }
    async function goToDestination(tab, raw) {

              selectedSearchEngine().replace("%s", encodeURIComponent(query)),

    }
    async function openProxyInTab(tab, url, addr, title, faviconUrl = null) {
      let proxiedUrl;

        proxiedUrl = await proxyExternalUrl(url);
      } catch (error) {

          const frame = pane.querySelector("[data-proxy-frame]");

          pane.querySelector("#view-notfound").classList.add("active");

            `The browser proxy could not start: ${error?.message || error}`;

          tab.displayAddr = addr;

      tab.title = title;

    }
    function wireBrowserPane(tab, pane) {

    function wireSettings(pane) {

      backend.value = localStorage.getItem("proxy-backend") === "scramjet" || localStorage.getItem("proxyType") === "SJ" ? "scramjet" : "uv";

      });

    function syncToolbarForActiveTab() {

        addressInput.value = tab.displayAddr || tab.history[tab.historyIndex];
      } else {
        addressInput.value = tab.addr;
      }
      updateNavButtons();
    }
    function updateNavButtons() {
      const tab = currentTab();
      const backBtn = document.querySelector("#back-btn");
      const fwdBtn = document.querySelector("#fwd-btn");
      if (!tab || tab.kind !== "browser") {
        backBtn.classList.add("disabled");
        fwdBtn.classList.add("disabled");
        return;
      }
      backBtn.classList.toggle("disabled", tab.historyIndex <= 0);
      fwdBtn.classList.toggle("disabled", tab.historyIndex >= tab.history.length - 1);
    }
    document.querySelector("#back-btn").addEventListener("click", () => {
      const tab = currentTab();
      if (!tab || tab.kind !== "browser") return;
      if (tab.historyIndex > 0) { tab.historyIndex--; navigateBrowserTab(tab, tab.history[tab.historyIndex], false); }
    });
    document.querySelector("#fwd-btn").addEventListener("click", () => {
      const tab = currentTab();
      if (!tab || tab.kind !== "browser") return;
      if (tab.historyIndex < tab.history.length - 1) { tab.historyIndex++; navigateBrowserTab(tab, tab.history[tab.historyIndex], false); }
    });
    document.querySelector("#reload-btn").addEventListener("click", () => {
      const tab = currentTab();
      if (!tab) return;
      if (tab.kind === "browser") {
        if (tab.proxyUrl) {
          const frame = paneEls[tab.id].querySelector("[data-proxy-frame]");
          if (frame) frame.src = tab.proxyUrl;
        } else {
          navigateBrowserTab(tab, tab.history[tab.historyIndex], false);
        }
      } else {
        const iframe = paneEls[tab.id].querySelector("iframe");
        iframe.src = iframe.src;
      }
    });
    document.querySelector("#home-btn").addEventListener("click", () => {
      const tab = currentTab();
      if (tab && tab.kind === "browser") navigateBrowserTab(tab, "cheddar://home");
    });
    document.querySelector("#settings-btn").addEventListener("click", () => {
      const tab = currentTab();
      if (tab && tab.kind === "browser") navigateBrowserTab(tab, "cheddar://settings");
    });
    document.querySelector("#bookmark-changelog").addEventListener("click", () => {
      const tab = currentTab();
      if (tab && tab.kind === "browser") navigateBrowserTab(tab, "cheddar://changelog");
    });
    addressInput.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const tab = currentTab();
      if (tab) goToDestination(tab, addressInput.value);
    });
    renderAnnouncement();
    const initialTab = makeBrowserTab();
    tabs.push(initialTab);
    buildPane(initialTab);
    activeTabId = initialTab.id;
    paneEls[initialTab.id].classList.add("active");
    renderTabStrip();
    syncToolbarForActiveTab();
    window.addEventListener('beforeunload', e => {
      if (window.__cheddarAllowClose) return;
      e.preventDefault();
      e.returnValue = '';
    });
  </script>
</body>
</html>
